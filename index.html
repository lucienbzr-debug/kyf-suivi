        <table><tr><th>${t('Article')}</th><th>${t('Prévu')}</th><th>${t('Remis')}</th><th>${t('Observation')}</th></tr>
        ${d.type === 'semences' ? (d.items || []).map((i) => `<tr><td>${U.esc(t(i.nom))}</td><td>${i.prevu ?? '—'} ${U.esc(i.unite)}</td><td>${i.remis} ${U.esc(i.unite)}</td><td></td></tr>`).join('')
          : (d.animaux || []).map((a) => `<tr><td>${U.esc(t(a.nom))}</td><td>${a.prevuM}♂ + ${a.prevuF}♀</td><td>${a.m}♂ + ${a.f}♀</td><td>${t('Santé')} : ${t((SANTE.find((x) => x[0] === a.sante) || [, ''])[1])} ${U.esc(a.obs || '')}</td></tr>`).join('')}</table>
        <p>${t('Agent')} : <b>${U.esc(d.agentNom)}</b> · ${t('Reçu par')} : ${d.receveur.type === 'mandataire' ? `${t('mandataire')} <b>${U.esc(d.receveur.nom)}</b> (${U.esc(t(d.receveur.lien))}${d.receveur.tel ? ', ' + U.esc(d.receveur.tel) : ''})` : t('le bénéficiaire')}
        · GPS : ${pr.gps ? `${pr.gps.lat}, ${pr.gps.lon} (±${pr.gps.acc} m)` : t('non disponible') + (pr.gpsErr ? ' — ' + U.esc(pr.gpsErr) : '')}
        · ${pr.qr ? t('Carte QR scannée') : t('Identification manuelle') + ' : ' + U.esc(t(pr.identMotif || ''))}
        ${d.ecart ? `<br>${t('Écart')} : ${U.esc(t(d.ecartMotif))} — ${U.esc(d.ecartComment)}` : ''}
        ${d.validation ? `<br>${t(d.statut === 'rejetee' ? 'Rejetée' : 'Validée')} ${t('par')} ${U.esc(d.validation.parNom)} ${t('le')} ${U.fmtDate(d.validation.date)} ${U.esc(d.validation.commentaire || '')}` : ''}</p>
        <div class="ev">${imgs.map((s) => `<img src="${s}">`).join('')}</div>`;
    }
    Print.a4(`<div class="a4">${Print.header(t('Fiche du ménage bénéficiaire'), `<b class="mono">${U.esc(h.id)}</b> · ${t('éditée le')} ${U.fmtDate(U.now())} ${t('par')} ${U.esc(S.user.nom)}`)}
      <div style="display:flex;gap:14px">${photo ? `<img src="${photo}" style="width:110px;height:130px;object-fit:cover;border:1px solid #ccc">` : ''}
      <dl class="kv" style="flex:1"><dt>${t('Nom et post-nom')}</dt><dd><b>${U.esc(h.nom)}</b></dd><dt>${t('Sexe · Âge')}</dt><dd>${U.esc(h.sexe || '—')} · ${h.age || U.esc(h.ageTranche) || '—'}</dd>
      <dt>${t('Territoire')} · CEP</dt><dd>${U.esc(h.territoire)} · ${U.esc(c.nom || '')} (${U.esc(h.cep)})</dd><dt>${t('Village')}</dt><dd>${U.esc(h.village || h.lieu || c.village || '—')}</dd>
      <dt>${t('Téléphone')} · ${t("Carte d'électeur")}</dt><dd>${U.esc(h.tel || '—')} · ${U.esc(h.carte || '—')}</dd><dt>${t('Facilitateur CEP')}</dt><dd>${U.esc(c.facilitateur || '—')}</dd></dl>
      <div style="width:110px">${QR.svg(h.id)}</div></div>
      ${(h.corrections || []).length ? `<h2>${t("Corrections d'identité")}</h2><table><tr><th>${t('Date')}</th><th>${t('Par')}</th><th>${t('Champ')}</th><th>${t('Avant')}</th><th>${t('Après')}</th><th>${t('Motif')}</th><th>${t('Contrôle')}</th></tr>${h.corrections.flatMap((c) => Object.entries(c.champs).map(([k, [a, b]]) => `<tr><td>${U.fmtDate(c.date)}</td><td>${U.esc(c.parNom)}</td><td>${t((ID_FIELDS.find((f) => f[0] === k) || [, k])[1])}</td><td>${U.esc(a)}</td><td>${U.esc(b)}</td><td>${U.esc(t(c.motif || ''))}</td><td>${c.revue ? t(c.revue.decision === 'annulee' ? 'Annulée' : 'Confirmée') + ' — ' + U.esc(c.revue.parNom) : t('À contrôler')}</td></tr>`)).join('')}</table>` : ''}
      <h2>${t('Profil du ménage')}</h2>
      ${p.completedAt ? `<dl class="kv"><dt>${t('Taille du ménage')}</dt><dd>${p.taille || '—'} (${p.hommes || 0} H / ${p.femmes || 0} F ; ${p.enf5 || 0} &lt;5 ${t('ans')} ; ${p.agees || 0} 60+)</dd>
        <dt>${t('Chef de ménage')}</dt><dd>${p.chef === 'non' ? U.esc(p.nomChef || '') : t('Le bénéficiaire')} · ${U.esc(t(p.etatCivil || ''))}</dd>
        <dt>${t('Vulnérabilité')}</dt><dd>${VULN.filter(([k]) => (p.vuln || {})[k]).map(([, l]) => t(l)).join(', ') || t('Aucune déclarée')} · ${U.esc(t(p.residence || ''))}</dd>
        <dt>${t('Agriculture')}</dt><dd>${p.superficie ? p.superficie + ' m²' : '—'} · ${U.esc(t(p.foncier || ''))} · ${(p.cultures || []).map((x) => t(x)).join(', ')}</dd>
        <dt>${t('Élevage existant')}</dt><dd>${(p.elevage || []).map((x) => t(x)).join(', ') || '—'}</dd></dl>` : `<p>${t('Profilage non réalisé.')}</p>`}
      ${dh || `<h2>${t('Distributions')}</h2><p>${t('Aucune distribution enregistrée.')}</p>`}
      <div class="sigs"><div>${t('Bénéficiaire')}</div><div>${t('Agent')}</div><div>${t('Superviseur')}</div></div>
      <div class="foot">${t('Document généré par l\'outil de suivi KILIMO YA FURAHA — données personnelles, usage strictement limité au projet.')}</div></div>`);
    await Store.audit('fiche-pdf', h.id);
  },

  /* ======================= PROFILAGE ======================= */
  async profilForm(id) {
    const isNew = !id;
    const h = isNew ? { id: null, nom: '', sexe: '', age: '', tel: '', carte: '', cep: Views.F.cep || '', village: '', profil: {}, verifier: [] } : JSON.parse(JSON.stringify(S.hh.get(id) || {}));
    if (!isNew && !h.id) return shell(`<div class="alert bad">${t('Ménage introuvable')}</div>`);
    const p = h.profil || {};
    let photoData = await Store.media(h.photo);
    let newPhoto = null, gps = p.gps || null;
    const num = (k, l) => `<label class="field"><span>${t(l)}</span><input type="number" min="0" inputmode="numeric" name="${k}" value="${p[k] ?? ''}"></label>`;
    const checks = (name, list, sel = []) => `<div class="checks">${list.map((x) => `<label class="check"><input type="checkbox" name="${name}" value="${U.esc(x)}" ${sel.includes(x) ? 'checked' : ''}>${U.esc(t(x))}</label>`).join('')}</div>`;
    await shell(`
      <div class="page-head"><div><div class="kicker">${isNew ? t('Nouveau ménage') : `<a href="#/m/${encodeURIComponent(h.id)}">${U.esc(h.id)}</a>`}</div><h1>${isNew ? t('Enregistrer un ménage') : t('Profilage du ménage')}</h1><div class="sub">${t('Composition · vulnérabilité · agriculture')}</div></div></div>
      <form id="pf" autocomplete="off">
        <fieldset><legend>${t('Consentement')}</legend>
          <label class="check"><input type="checkbox" name="consent" ${p.consent ? 'checked' : ''}><span>${t('Le bénéficiaire a été informé de l\'objectif de la collecte (suivi du projet) et accepte que ses informations, sa photo et la position GPS de la remise soient enregistrées.')}<br><i class="muted small">Mnufaika amejulishwa lengo la ukusanyaji na anakubali taarifa zake, picha yake na mahali pa ugawaji viandikwe.</i></span></label><div style="height:10px"></div></fieldset>
        <fieldset><legend>${t('Identité')}</legend><div class="form-grid">
          <label class="field"><span>${t('Nom et post-nom')} <b class="req">*</b></span><input type="text" name="nom" value="${U.esc(h.nom)}" required></label>
          <label class="field"><span>${t('Sexe')} <b class="req">*</b></span><div class="seg"><label><input type="radio" name="sexe" value="F" ${h.sexe === 'F' ? 'checked' : ''}>${t('Femme')}</label><label><input type="radio" name="sexe" value="M" ${h.sexe === 'M' ? 'checked' : ''}>${t('Homme')}</label></div></label>
          <label class="field"><span>${t('Âge')}</span><input type="number" name="age" min="12" max="110" inputmode="numeric" value="${h.age || ''}" placeholder="${U.esc(h.ageTranche || '')}"></label>
          <label class="field"><span>${t('Téléphone')}</span><input type="tel" name="tel" value="${U.esc(h.tel)}"></label>
          <label class="field"><span>${t("N° carte d'électeur")}</span><input type="text" name="carte" inputmode="numeric" value="${U.esc(h.carte)}"></label>
          <label class="field"><span>CEP <b class="req">*</b></span><select name="cep" ${isNew ? '' : UI.isSup() ? '' : 'disabled'}><option value="">—</option>${UI.opt(Views.cepsOf('').map((c) => [c.id, `${c.territoire} · ${c.nom}`]), h.cep)}</select></label>
          <label class="field"><span>${t('Village / localité')}</span><input type="text" name="village" value="${U.esc(h.village || h.lieu || '')}"></label>
        </div>
        <div class="field"><span>${t('Photo du bénéficiaire (pour la carte)')}</span><div class="photo-slot ${photoData ? 'filled' : ''}" id="ph" style="max-width:220px">${photoData ? `<img src="${photoData}">` : `${IC.camera}<div>${t('Prendre la photo')}</div>`}</div></div></fieldset>
        <fieldset><legend>${t('Composition du ménage')}</legend><div class="form-grid">
          <label class="field"><span>${t('Le bénéficiaire est-il chef de ménage ?')}</span><div class="seg"><label><input type="radio" name="chef" value="oui" ${p.chef !== 'non' ? 'checked' : ''}>${t('Oui')}</label><label><input type="radio" name="chef" value="non" ${p.chef === 'non' ? 'checked' : ''}>${t('Non')}</label></div></label>
          <label class="field chefx"><span>${t('Nom du chef de ménage')}</span><input type="text" name="nomChef" value="${U.esc(p.nomChef || '')}"></label>
          <label class="field chefx"><span>${t('Lien avec le chef')}</span><select name="lienChef"><option value="">—</option>${UI.opt(LIENS.map((x) => [x, t(x)]), p.lienChef)}</select></label>
          <label class="field"><span>${t('État civil')}</span><select name="etatCivil"><option value="">—</option>${UI.opt(['Marié(e)', 'Union libre', 'Célibataire', 'Veuf / veuve', 'Divorcé(e) / séparé(e)'].map((x) => [x, t(x)]), p.etatCivil)}</select></label>
          ${num('taille', 'Nombre total de personnes')}${num('hommes', 'Dont hommes / garçons')}${num('femmes', 'Dont femmes / filles')}${num('enf5', 'Enfants de moins de 5 ans')}${num('enf517', 'Enfants de 5 à 17 ans')}${num('agees', 'Personnes de 60 ans et +')}
          <label class="field"><span>${t("Niveau d'instruction du bénéficiaire")}</span><select name="instruction"><option value="">—</option>${UI.opt(['Aucun', 'Primaire', 'Secondaire', 'Supérieur'].map((x) => [x, t(x)]), p.instruction)}</select></label>
        </div></fieldset>
        <fieldset><legend>${t('Vulnérabilité')}</legend>
          <div class="checks">${VULN.map(([k, l]) => `<label class="check"><input type="checkbox" name="v_${k}" ${(p.vuln || {})[k] ? 'checked' : ''}>${t(l)}</label>`).join('')}</div>
          <label class="field" style="margin-top:10px"><span>${t('Statut de résidence')}</span><select name="residence"><option value="">—</option>${UI.opt(['Résident', 'Déplacé interne', 'Retourné', "Famille d'accueil"].map((x) => [x, t(x)]), p.residence)}</select></label></fieldset>
        <fieldset><legend>${t('Agriculture')}</legend><div class="form-grid">
          <label class="field"><span>${t('Superficie cultivée (m²)')}</span><input type="number" min="0" name="superficie" inputmode="decimal" value="${p.superficie || h.superficie || ''}"></label>
          <label class="field"><span>${t('Accès à la terre')}</span><select name="foncier"><option value="">—</option>${UI.opt(['Propriétaire', 'Location', 'Prêt / emprunt', 'Métayage', 'Terre communautaire', 'Sans terre'].map((x) => [x, t(x)]), p.foncier)}</select></label>
          <label class="field"><span>${t('Membre d\'une coopérative / organisation')}</span><input type="text" name="organisation" value="${U.esc(p.organisation || '')}"></label></div>
          <div class="field"><span>${t('Cultures pratiquées')}</span>${checks('cultures', CULTURES, p.cultures || [])}</div>
          <div class="field"><span>${t('Élevage déjà pratiqué')}</span>${checks('elevage', ELEVAGE, p.elevage || [])}</div></fieldset>
        <fieldset><legend>${t('Localisation du ménage (facultatif)')}</legend><div class="row"><button type="button" class="btn" id="gps">${IC.pin} ${t('Enregistrer la position')}</button><span id="gpsv">${gps ? Geo.link(gps) : ''}</span></div><div style="height:10px"></div></fieldset>
        <label class="field"><span>${t('Observations')}</span><textarea name="obs">${U.esc(p.obs || '')}</textarea></label>
        <div class="row" style="justify-content:flex-end"><a class="btn" href="${isNew ? '#/menages' : '#/m/' + encodeURIComponent(h.id)}">${t('Annuler')}</a><button class="btn primary" type="submit">${t('Enregistrer')}</button></div>
      </form>`);
    const form = U.$('#pf');
    const chefToggle = () => U.$$('.chefx', form).forEach((e) => e.classList.toggle('hidden', form.chef.value !== 'non'));
    U.$$('input[name=chef]', form).forEach((r) => (r.onchange = chefToggle)); chefToggle();
    U.$('#ph').onclick = async () => {
      const d = await Camera.photo(720, 0.7);
      if (d) { newPhoto = d; U.$('#ph').innerHTML = `<img src="${d}">`; U.$('#ph').classList.add('filled'); }
    };
    U.$('#gps').onclick = async () => { U.$('#gpsv').textContent = t('Recherche GPS…'); try { gps = await Geo.get(); U.$('#gpsv').innerHTML = Geo.link(gps); } catch (e) { U.$('#gpsv').innerHTML = `<span class="badge bad">${U.esc(e.message)}</span>`; } };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const nom = String(fd.get('nom') || '').trim().toUpperCase();
      const cep = isNew || UI.isSup() ? fd.get('cep') : h.cep;
      if (nom.length < 3) return UI.toast(t('Indiquez le nom complet'), 'bad');
      if (!fd.get('sexe')) return UI.toast(t('Indiquez le sexe'), 'bad');
      if (!cep) return UI.toast(t('Choisissez le CEP'), 'bad');
      if ((newPhoto || gps) && !fd.get('consent')) return UI.toast(t('Le consentement est requis pour enregistrer la photo ou la position.'), 'bad');
      if (isNew) {
        const dup = [...S.hh.values()].find((x) => x.cep === cep && U.norm(x.nom) === U.norm(nom));
        if (dup && !(await UI.confirm(t('Un ménage portant ce nom existe déjà dans ce CEP ({id}). Enregistrer quand même ?', { id: dup.id }), t('Enregistrer')))) return;
        h.id = Store.newHouseholdId(cep);
        h.territoire = (S.ceps.get(cep) || {}).territoire || '';
        h._src = 'terrain';
      }
      const changedFields = [];
      const set = (k, v) => { if (String(h[k] ?? '') !== String(v ?? '')) { changedFields.push(k); h[k] = v; } };
      set('nom', nom); set('sexe', fd.get('sexe')); set('age', fd.get('age') ? +fd.get('age') : h.age || '');
      set('tel', String(fd.get('tel') || '').trim()); set('carte', String(fd.get('carte') || '').trim()); set('village', String(fd.get('village') || '').trim());
      if (cep !== h.cep) { set('cep', cep); h.territoire = (S.ceps.get(cep) || {}).territoire || h.territoire; }
      h.verifier = (h.verifier || []).filter((k) => !changedFields.includes(k) && !(k === 'village' && changedFields.includes('village')));
      if (newPhoto) h.photo = await Store.putMedia(newPhoto, 'portrait');
      const np = {
        ...p, consent: !!fd.get('consent'), consentDate: fd.get('consent') ? p.consentDate || U.now() : null,
        chef: fd.get('chef'), nomChef: fd.get('chef') === 'non' ? fd.get('nomChef') : '', lienChef: fd.get('chef') === 'non' ? fd.get('lienChef') : '',
        etatCivil: fd.get('etatCivil'), instruction: fd.get('instruction'), residence: fd.get('residence'),
        foncier: fd.get('foncier'), organisation: fd.get('organisation'), obs: fd.get('obs'),
        cultures: fd.getAll('cultures'), elevage: fd.getAll('elevage'), gps,
        vuln: Object.fromEntries(VULN.map(([k]) => [k, !!fd.get('v_' + k)])),
      };
      ['taille', 'hommes', 'femmes', 'enf5', 'enf517', 'agees', 'superficie'].forEach((k) => (np[k] = fd.get(k) === '' ? '' : +fd.get(k)));
      if (h.sexe === 'F' && np.chef !== 'non') np.vuln.femmeCheffe = true;
      if (np.residence === 'Déplacé interne' || np.residence === 'Retourné') np.vuln.deplace = true;
      if (np.taille && (+np.hommes || 0) + (+np.femmes || 0) > np.taille) return UI.toast(t('Hommes + femmes dépasse la taille du ménage'), 'bad');
      np.completedAt = np.taille && np.chef ? p.completedAt || U.now() : p.completedAt || null;
      np.by = S.user.nom;
      h.profil = np;
      await Store.saveHh(h, isNew ? 'menage-cree' : 'profilage');
      UI.toast(t('Enregistré'), 'ok');
      location.hash = '#/m/' + encodeURIComponent(h.id);
    };
  },
};

/* Écrans : distribution, validation, cartes, rapports, synchronisation, paramètres. */
Object.assign(Views, {
  /* ======================= DISTRIBUER : IDENTIFICATION ======================= */
  async distribuer() {
    await shell(`
      <div class="page-head"><div><div class="kicker">${t('Distribution')}</div><h1>${t('Identifier le ménage')}</h1><div class="sub">${t('Scannez le QR code au verso de la carte du bénéficiaire.')}</div></div></div>
      <button class="btn primary xl block" id="scan">${IC.qr} ${t('Scanner la carte (QR)')}</button>
      ${QRScan.supported() ? '' : `<div class="alert warn small" style="margin-top:8px">${t("Ce navigateur ne sait pas lire les QR codes. Utilisez Google Chrome sur Android, ou recherchez le ménage par nom / ID.")}</div>`}
      <div class="card" style="margin-top:14px"><h2>${t('Sans carte : recherche manuelle')}</h2>
        <input type="search" id="q" placeholder="${t('Nom, ID, téléphone, carte d\'électeur')}">
        <div id="res" class="list" style="margin-top:10px"></div></div>`);
    U.$('#scan').onclick = async () => {
      const id = await QRScan.scan();
      if (!id) return;
      if (!S.hh.has(id)) return UI.toast(t('Carte inconnue dans ce registre : {id}. Synchronisez avec le superviseur.', { id }), 'bad');
      Views.startWizard(id, true);
    };
    let tm;
    U.$('#q').oninput = (e) => {
      clearTimeout(tm);
      tm = setTimeout(() => {
        const q = U.norm(e.target.value);
        if (q.length < 2) { U.$('#res').innerHTML = ''; return; }
        const arr = [...S.hh.values()].filter((h) => U.norm(h.nom).includes(q) || U.norm(h.id).includes(q) || String(h.tel).includes(q) || String(h.carte).includes(q)).slice(0, 25);
        U.$('#res').innerHTML = arr.map((h) => { const c = S.ceps.get(h.cep) || {}; const s = Store.statusOf(h); return `<button class="item" data-id="${U.esc(h.id)}" style="text-align:left;cursor:pointer"><div class="av">${U.esc(U.initials(h.nom))}</div><div class="main"><div class="t">${U.esc(h.nom)}</div><div class="m">${U.esc(h.id)} · ${U.esc(c.nom || '')}</div></div><div class="side">${UI.badgeStatut(s.code)}</div></button>`; }).join('') || `<p class="muted">${t('Aucun résultat')}</p>`;
        U.$$('[data-id]', U.$('#res')).forEach((b) => (b.onclick = () => Views.startWizard(b.dataset.id, false)));
      }, 200);
    };
  },
  /* Confirme l'identité du ménage avant une remise ouverte depuis sa fiche. */
  async identify(id) {
    const h = S.hh.get(id);
    return UI.modal({
      title: t("Confirmer l'identité"),
      body: `<p><b>${U.esc(h.nom)}</b> <span class="mono small">${U.esc(h.id)}</span></p><button class="btn primary block" id="sc">${IC.qr} ${t('Scanner la carte (QR)')}</button>
        <div class="reading"></div><label class="field"><span>${t('Sans QR : motif')}</span><select id="mo">${UI.opt(MOTIFS_IDENT.map((x) => [x, t(x)]))}</select></label>`,
      actions: [{ label: t('Annuler'), value: null }, { label: t('Continuer sans QR'), onClick: (el) => ({ qr: false, motif: U.$('#mo', el).value }) }],
      onOpen: (el, close) => {
        U.$('#sc', el).onclick = async () => {
          const got = await QRScan.scan();
          if (!got) return;
          if (got !== id) { UI.toast(t('Cette carte appartient à un autre ménage : {id}', { id: got }), 'bad'); return; }
          close({ qr: true, motif: '' });
        };
      },
    });
  },
  async startWizard(id, qr) {
    const h = S.hh.get(id);
    const s = Store.statusOf(h);
    const c = S.ceps.get(h.cep) || {};
    let motif = null;
    if (!qr) {
      motif = await UI.modal({
        title: t('Identification sans QR'),
        body: `<p class="small">${t('Pourquoi la carte n\'est-elle pas scannée ? Cette information est vérifiée par le superviseur.')}</p><select id="mo">${UI.opt(MOTIFS_IDENT.map((x) => [x, t(x)]))}</select>`,
        actions: [{ label: t('Annuler'), value: null }, { label: t('Continuer'), cls: 'primary', onClick: (el) => U.$('#mo', el).value }],
      });
      if (!motif) return;
    }
    const pick = await UI.modal({
      title: U.esc(h.nom),
      body: `<p class="muted small mono">${U.esc(h.id)} · ${U.esc(c.nom || '')}</p><p>${t('Que remettez-vous ?')}</p>`,
      actions: [{ label: t('Annuler'), value: null },
        { label: (s.sem ? '✓ ' : '') + t('Kit de semences'), cls: s.sem ? '' : 'primary', value: 'semences' },
        { label: (s.bet ? '✓ ' : '') + t('Petit bétail'), cls: s.bet ? '' : 'primary', value: 'betail' }],
    });
    if (!pick) return;
    Views.W = { hhId: id, type: pick, qr, identMotif: motif, step: 1, fresh: true };
    location.hash = `#/d/${encodeURIComponent(id)}/${pick}`;
  },

  /* ======================= ASSISTANT DE REMISE ======================= */
  async wizard(id, type) {
    const h = S.hh.get(id);
    if (!h) return shell(`<div class="alert bad">${t('Ménage introuvable')}</div>`);
    const existing = Store.activeDist(id, type);
    if (existing) {
      return shell(`<div class="page-head"><div><h1>${t(type === 'semences' ? 'Kit de semences' : 'Petit bétail')}</h1></div></div>
        <div class="alert bad"><b>${t('Déjà remis.')}</b> ${t('Ce ménage a déjà reçu ce lot le {d} (agent : {a}, statut : {s}). Une deuxième remise n\'est pas autorisée.', { d: U.fmtDate(existing.date), a: existing.agentNom, s: t({ en_attente: 'En attente', validee: 'Validée' }[existing.statut]) })}</div>
        <p style="margin-top:12px"><a class="btn" href="#/m/${encodeURIComponent(id)}">${t('Voir la fiche du ménage')}</a> <a class="btn primary" href="#/distribuer">${t('Ménage suivant')}</a></p>`);
    }
    let W = Views.W;
    if (!W || W.hhId !== id || W.type !== type) {
      const r = await Views.identify(id);
      if (!r) { location.hash = '#/m/' + encodeURIComponent(id); return; }
      W = Views.W = { hhId: id, type, qr: r.qr, identMotif: r.motif, step: 1 };
    }
    if (!W.init) {
      W.init = true;
      W.receveur = { type: 'beneficiaire', nom: '', lien: '', tel: '', photo: null, photoData: null };
      W.consent = !!(h.profil && h.profil.consent);
      if (type === 'semences') {
        const kit = Store.kitFor(h);
        W.kitNom = kit ? kit.nom : '';
        W.items = kit ? kit.items.map((i) => ({ code: i.code, nom: i.nom, unite: i.unite, prevu: i.qte == null || i.qte === '' ? null : +i.qte, remis: i.qte == null || i.qte === '' ? '' : +i.qte })) : [];
      } else {
        W.animaux = S.settings.animaux.map((a) => ({ code: a.code, nom: a.nom, lm: a.male, lf: a.femelle, prevuM: a.m, prevuF: a.f, m: a.m, f: a.f, sante: 'bon', obs: '' }));
      }
      W.preuves = { photo: null, photoData: null, signature: null, empreinte: null, empreinteData: null, gps: null, gpsErr: '' };
      W.mode = 'signature';
    }
    W.dirty = true;
    const c = S.ceps.get(h.cep) || {};
    const portrait = await Store.media(h.photo);
    const title = t(type === 'semences' ? 'Remise du kit de semences' : 'Remise du petit bétail');
    const stepsBar = `<div class="steps">${[1, 2, 3, 4].map((i) => `<div class="${i < W.step ? 'done' : i === W.step ? 'cur' : ''}"></div>`).join('')}</div>`;
    const head = `<div class="page-head"><div><div class="kicker">${t('Étape')} ${W.step}/4 · ${U.esc(h.id)}</div><h1>${title}</h1><div class="sub">${U.esc(h.nom)} · ${U.esc(c.nom || '')}</div></div></div>${stepsBar}`;
    const nav = (next = t('Suivant'), cls = 'primary') => `<div class="row between" style="margin-top:16px"><button class="btn" id="prev">${W.step === 1 ? t('Annuler') : t('Retour')}</button><button class="btn ${cls}" id="next">${next}</button></div>`;
    const ecart = () => {
      if (type === 'semences') return W.items.some((i) => i.prevu != null && +i.remis !== +i.prevu);
      return W.animaux.some((a) => +a.m !== +a.prevuM || +a.f !== +a.prevuF);
    };

    if (W.step === 1) {
      await shell(`${head}
        <div class="card"><div class="row" style="align-items:flex-start">
          <div style="width:96px;height:112px;border-radius:10px;background:var(--panel-2);overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:28px;color:var(--brand-2)">${portrait ? `<img src="${portrait}" style="width:100%;height:100%;object-fit:cover">` : U.esc(U.initials(h.nom))}</div>
          <dl class="kv" style="flex:1"><dt>${t('Nom')}</dt><dd>${U.esc(h.nom)}</dd><dt>${t('Sexe · Âge')}</dt><dd>${U.esc(h.sexe || '—')} · ${h.age || U.esc(h.ageTranche) || '—'}</dd><dt>CEP</dt><dd>${U.esc(c.nom || '')}</dd><dt>${t('Village')}</dt><dd>${U.esc(h.village || h.lieu || c.village || '—')}</dd>
          <dt>${t('Identification')}</dt><dd>${W.qr ? `<span class="badge ok">QR ${t('scanné')}</span>` : `<span class="badge warn">${U.esc(t(W.identMotif || ''))}</span>`}</dd></dl></div>
          ${h.verifier && h.verifier.length ? `<div class="alert warn small" style="margin-top:10px">${t('Vérifiez l\'identité : le nom ou d\'autres informations de la fiche source sont incertains.')}</div>` : ''}</div>
        <div class="card"><h2>${t('Qui reçoit ?')}</h2>
          <div class="seg"><label><input type="radio" name="rc" value="beneficiaire" ${W.receveur.type === 'beneficiaire' ? 'checked' : ''}>${t('Le bénéficiaire')}</label><label><input type="radio" name="rc" value="mandataire" ${W.receveur.type === 'mandataire' ? 'checked' : ''}>${t('Un mandataire')}</label></div>
          <div id="mand" class="${W.receveur.type === 'mandataire' ? '' : 'hidden'}" style="margin-top:12px"><div class="form-grid">
            <label class="field"><span>${t('Nom du mandataire')} <b class="req">*</b></span><input type="text" id="m-nom" value="${U.esc(W.receveur.nom)}"></label>
            <label class="field"><span>${t('Lien avec le bénéficiaire')} <b class="req">*</b></span><select id="m-lien"><option value="">—</option>${UI.opt(LIENS.map((x) => [x, t(x)]), W.receveur.lien)}</select></label>
            <label class="field"><span>${t('Téléphone')}</span><input type="tel" id="m-tel" value="${U.esc(W.receveur.tel)}"></label></div>
            <div class="field"><span>${t('Photo du mandataire')} <b class="req">*</b></span><div class="photo-slot ${W.receveur.photoData ? 'filled' : ''}" id="m-ph" style="max-width:240px">${W.receveur.photoData ? `<img src="${W.receveur.photoData}">` : `${IC.camera}<div>${t('Prendre la photo')}</div>`}</div></div></div>
          <label class="check" style="margin-top:12px"><input type="checkbox" id="consent" ${W.consent ? 'checked' : ''}><span>${t('La personne accepte la photo, la signature/empreinte et la position GPS comme preuves de remise.')}<br><i class="muted small">Anakubali picha, sahihi/alama ya kidole na mahali (GPS) kama ushahidi wa kupokea.</i></span></label></div>
        ${nav()}`);
      U.$$('input[name=rc]').forEach((r) => (r.onchange = () => { W.receveur.type = r.value; U.$('#mand').classList.toggle('hidden', r.value !== 'mandataire'); }));
      U.$('#m-ph').onclick = async () => { const d = await Camera.photo(); if (d) { W.receveur.photoData = d; W.receveur.photo = await Store.putMedia(d, 'mandataire'); U.$('#m-ph').innerHTML = `<img src="${d}">`; U.$('#m-ph').classList.add('filled'); } };
      U.$('#prev').onclick = async () => { if (await UI.confirm(t('Abandonner cette remise ?'), t('Abandonner'), 'danger')) { Views.W = null; location.hash = '#/distribuer'; } };
      U.$('#next').onclick = () => {
        W.receveur.nom = U.$('#m-nom').value.trim(); W.receveur.lien = U.$('#m-lien').value; W.receveur.tel = U.$('#m-tel').value.trim();
        W.consent = U.$('#consent').checked;
        if (!W.consent) return UI.toast(t('Le consentement est requis pour enregistrer les preuves.'), 'bad');
        if (W.receveur.type === 'mandataire' && (W.receveur.nom.length < 3 || !W.receveur.lien || !W.receveur.photo)) return UI.toast(t('Complétez le nom, le lien et la photo du mandataire.'), 'bad');
        W.step = 2; Views.wizard(id, type);
      };
      return;
    }

    if (W.step === 2) {
      const body = type === 'semences'
        ? (W.items.length ? `<div class="qty" style="border:0;font-size:12px;font-weight:800;color:var(--ink-3)"><div>${t('Article')}</div><div class="p">${t('Prévu')}</div><div style="text-align:center">${t('Remis')}</div></div>
          ${W.items.map((i, k) => `<div class="qty ${i.prevu != null && +i.remis !== +i.prevu ? 'diff' : ''}" data-k="${k}"><div><b>${U.esc(t(i.nom))}</b> <span class="muted small">${U.esc(i.unite)}</span></div><div class="p">${i.prevu ?? '—'}</div><input type="number" min="0" step="any" inputmode="decimal" value="${i.remis}" data-item="${k}"></div>`).join('')}
          <p class="muted small">${t('Kit')} : ${U.esc(t(W.kitNom))}</p>`
          : `<div class="alert bad">${t('Aucun kit n\'est affecté à ce CEP. Le superviseur doit l\'affecter dans Paramètres.')}</div>`)
        : W.animaux.map((a, k) => `<div class="animal"><div class="hd"><span>${U.esc(t(a.nom))}</span><span class="muted small">${t('Prévu')} : ${a.prevuM} ${U.esc(t(a.lm).toLowerCase())} + ${a.prevuF} ${U.esc(t(a.lf).toLowerCase())}</span></div>
          <div class="mf"><label class="field"><span>${U.esc(t(a.lm))} (♂)</span><input type="number" min="0" inputmode="numeric" value="${a.m}" data-an="${k}" data-sx="m"></label><label class="field"><span>${U.esc(t(a.lf))} (♀)</span><input type="number" min="0" inputmode="numeric" value="${a.f}" data-an="${k}" data-sx="f"></label></div>
          <div class="field"><span>${t('État de santé à la remise')}</span><div class="seg">${SANTE.map(([v, l]) => `<label><input type="radio" name="s${k}" value="${v}" ${a.sante === v ? 'checked' : ''} data-sa="${k}">${t(l)}</label>`).join('')}</div></div>
          <input type="text" placeholder="${t('Observation (poids, signes de maladie, vaccin…)')}" value="${U.esc(a.obs)}" data-ob="${k}"></div>`).join('');
      await shell(`${head}<div class="card"><h2>${t(type === 'semences' ? 'Quantités remises' : 'Animaux remis')}</h2>${body}
        <div id="ec" class="${ecart() ? '' : 'hidden'}" style="margin-top:12px"><div class="alert warn small" style="margin-bottom:8px">${t('Les quantités remises diffèrent du prévu : indiquez le motif.')}</div>
          <label class="field"><span>${t('Motif de l\'écart')} <b class="req">*</b></span><select id="e-mo"><option value="">—</option>${UI.opt(MOTIFS_ECART.map((x) => [x, t(x)]), W.ecartMotif)}</select></label>
          <label class="field"><span>${t('Explication')} <b class="req">*</b></span><textarea id="e-co">${U.esc(W.ecartComment || '')}</textarea></label></div></div>${nav()}`);
      const refresh = () => {
        U.$$('[data-item]').forEach((inp) => { const i = W.items[+inp.dataset.item]; i.remis = inp.value === '' ? '' : +inp.value; inp.closest('.qty').classList.toggle('diff', i.prevu != null && +i.remis !== +i.prevu); });
        U.$$('[data-an]').forEach((inp) => { W.animaux[+inp.dataset.an][inp.dataset.sx] = inp.value === '' ? 0 : +inp.value; });
        U.$$('[data-sa]:checked').forEach((r) => (W.animaux[+r.dataset.sa].sante = r.value));
        U.$$('[data-ob]').forEach((inp) => (W.animaux[+inp.dataset.ob].obs = inp.value));
        U.$('#ec').classList.toggle('hidden', !ecart());
      };
      U.$$('#main input').forEach((i) => (i.oninput = i.onchange = refresh));
      U.$('#prev').onclick = () => { refresh(); W.step = 1; Views.wizard(id, type); };
      U.$('#next').onclick = () => {
        refresh();
        W.ecartMotif = U.$('#e-mo').value; W.ecartComment = U.$('#e-co').value.trim();
        if (type === 'semences' && !W.items.length) return UI.toast(t('Aucun kit affecté.'), 'bad');
        if (type === 'semences' && W.items.some((i) => i.remis === '' || +i.remis < 0)) return UI.toast(t('Saisissez la quantité remise pour chaque article (0 si rien).'), 'bad');
        if (type === 'semences' && W.items.every((i) => !+i.remis)) return UI.toast(t('Aucune quantité remise.'), 'bad');
        if (ecart() && (!W.ecartMotif || W.ecartComment.length < 3)) return UI.toast(t('Indiquez le motif et une explication de l\'écart.'), 'bad');
        W.step = 3; Views.wizard(id, type);
      };
      return;
    }

    if (W.step === 3) {
      const P = W.preuves;
      await shell(`${head}
        <div class="card"><h2>1. ${t('Photo de la remise')} <b class="req" style="color:var(--bad)">*</b></h2><p class="muted small">${t('Le bénéficiaire (ou le mandataire) avec le kit ou les animaux, visage visible.')}</p>
          <div class="photo-slot ${P.photoData ? 'filled' : ''}" id="p-ph">${P.photoData ? `<img src="${P.photoData}">` : `${IC.camera}<div><b>${t('Prendre la photo')}</b></div>`}</div></div>
        <div class="card"><h2>2. ${t('Signature ou empreinte')} <b class="req" style="color:var(--bad)">*</b></h2>
          <div class="seg" style="margin-bottom:10px"><label><input type="radio" name="sm" value="signature" ${W.mode === 'signature' ? 'checked' : ''}>${t('Signature à l\'écran')}</label><label><input type="radio" name="sm" value="empreinte" ${W.mode === 'empreinte' ? 'checked' : ''}>${t('Photo de l\'empreinte')}</label></div>
          <div id="m-sig" class="${W.mode === 'signature' ? '' : 'hidden'}">${P.signature ? `<img src="${await Store.media(P.signature)}" style="width:100%;border:2px solid var(--ok);border-radius:12px;background:#fff"><button class="btn sm" id="sig-redo" style="margin-top:6px">${t('Refaire la signature')}</button>` : `<canvas class="sigpad" id="sig"></canvas><div class="row" style="margin-top:6px"><button class="btn sm" id="sig-clear">${t('Effacer')}</button><button class="btn sm primary" id="sig-ok">${t('Valider la signature')}</button></div>`}</div>
          <div id="m-emp" class="${W.mode === 'empreinte' ? '' : 'hidden'}"><p class="muted small">${t('Faites apposer l\'empreinte du pouce sur la fiche de distribution papier, puis photographiez-la.')}</p><div class="photo-slot ${P.empreinteData ? 'filled' : ''}" id="p-emp">${P.empreinteData ? `<img src="${P.empreinteData}">` : `${IC.camera}<div>${t('Photographier l\'empreinte')}</div>`}</div></div></div>
        <div class="card"><h2>3. ${t('Position GPS et heure')}</h2><div id="gpsbox">${P.gps ? `${Geo.link(P.gps)} <span class="badge ok">${U.fmtDate(P.gps.ts)}</span>` : `<span class="muted">${t('Recherche de la position…')}</span>`}</div>
          <div class="row" style="margin-top:8px"><button class="btn sm" id="gps-retry">${IC.pin} ${t('Relancer le GPS')}</button></div>
          <div id="gpserr" class="${!P.gps && P.gpsErr ? '' : 'hidden'}" style="margin-top:8px"><label class="field"><span>${t('Si le GPS ne fonctionne pas, expliquez pourquoi')}</span><input type="text" id="gps-why" value="${U.esc(P.gpsWhy || '')}"></label></div></div>
        ${nav()}`);
      const sigInit = () => {
        const cv = U.$('#sig');
        if (!cv) return;
        const pad = SigPad(cv);
        U.$('#sig-clear').onclick = () => pad.clear();
        U.$('#sig-ok').onclick = async () => { if (pad.isEmpty()) return UI.toast(t('Signature vide'), 'bad'); P.signature = await Store.putMedia(pad.data(), 'signature'); Views.wizard(id, type); };
      };
      sigInit();
      const redo = U.$('#sig-redo'); if (redo) redo.onclick = () => { P.signature = null; Views.wizard(id, type); };
      U.$$('input[name=sm]').forEach((r) => (r.onchange = () => { W.mode = r.value; U.$('#m-sig').classList.toggle('hidden', r.value !== 'signature'); U.$('#m-emp').classList.toggle('hidden', r.value !== 'empreinte'); if (r.value === 'signature') sigInit(); }));
      U.$('#p-ph').onclick = async () => { const d = await Camera.photo(); if (d) { P.photoData = d; P.photo = await Store.putMedia(d, 'remise'); U.$('#p-ph').innerHTML = `<img src="${d}">`; U.$('#p-ph').classList.add('filled'); } };
      U.$('#p-emp').onclick = async () => { const d = await Camera.photo(1200, 0.75); if (d) { P.empreinteData = d; P.empreinte = await Store.putMedia(d, 'empreinte'); U.$('#p-emp').innerHTML = `<img src="${d}">`; U.$('#p-emp').classList.add('filled'); } };
      const doGps = async () => {
        U.$('#gpsbox').innerHTML = `<span class="muted">${t('Recherche de la position…')}</span>`;
        try { P.gps = await Geo.get(); P.gpsErr = ''; if (U.$('#gpsbox')) { U.$('#gpsbox').innerHTML = `${Geo.link(P.gps)} <span class="badge ok">${U.fmtDate(P.gps.ts)}</span>`; U.$('#gpserr').classList.add('hidden'); } }
        catch (e) { P.gpsErr = e.message; if (U.$('#gpsbox')) { U.$('#gpsbox').innerHTML = `<span class="badge bad">${U.esc(e.message)}</span>`; U.$('#gpserr').classList.remove('hidden'); } }
      };
      U.$('#gps-retry').onclick = doGps;
      if (!P.gps) doGps();
      U.$('#prev').onclick = () => { W.step = 2; Views.wizard(id, type); };
      U.$('#next').onclick = () => {
        P.gpsWhy = (U.$('#gps-why') || {}).value || '';
        if (!P.photo) return UI.toast(t('La photo de remise est obligatoire.'), 'bad');
        if (!P.signature && !P.empreinte) return UI.toast(t('La signature ou l\'empreinte est obligatoire.'), 'bad');
        if (!P.gps && P.gpsWhy.trim().length < 3) { U.$('#gpserr').classList.remove('hidden'); return UI.toast(t('Position GPS absente : indiquez la raison.'), 'bad'); }
        W.step = 4; Views.wizard(id, type);
      };
      return;
    }

    // Étape 4 : récapitulatif
    const P = W.preuves;
    const sig = await Store.media(P.signature);
    await shell(`${head}<div class="card"><h2>${t('Récapitulatif')}</h2>
      <dl class="kv"><dt>${t('Ménage')}</dt><dd>${U.esc(h.nom)} <span class="mono small">${U.esc(h.id)}</span></dd>
      <dt>${t('Reçu par')}</dt><dd>${W.receveur.type === 'mandataire' ? `${t('mandataire')} ${U.esc(W.receveur.nom)} (${U.esc(t(W.receveur.lien))})` : t('le bénéficiaire')}</dd>
      <dt>${t('Remis')}</dt><dd>${type === 'semences' ? W.items.map((i) => `${U.esc(t(i.nom))} : <b>${i.remis}</b> ${U.esc(i.unite)}`).join('<br>') : W.animaux.map((a) => `${U.esc(t(a.nom))} : <b>${a.m}♂ + ${a.f}♀</b> — ${t((SANTE.find((x) => x[0] === a.sante) || [])[1])}`).join('<br>')}</dd>
      ${ecart() ? `<dt>${t('Écart')}</dt><dd><span class="badge warn">${U.esc(t(W.ecartMotif))}</span> ${U.esc(W.ecartComment)}</dd>` : ''}
      <dt>${t('Identification')}</dt><dd>${W.qr ? `<span class="badge ok">QR ${t('scanné')}</span>` : `<span class="badge warn">${U.esc(t(W.identMotif))}</span>`}</dd>
      <dt>GPS</dt><dd>${P.gps ? Geo.link(P.gps) : `<span class="badge bad">${t('Sans GPS')}</span> ${U.esc(P.gpsWhy)}`}</dd>
      <dt>${t('Date et heure')}</dt><dd>${U.fmtDate(U.now())}</dd><dt>${t('Agent')}</dt><dd>${U.esc(S.user.nom)}</dd></dl>

      <label class="field" style="margin-top:12px"><span>${t('Observation générale (facultatif)')}</span><textarea id="obs">${U.esc(W.obs || '')}</textarea></label>
      <div class="alert info small">${t('En confirmant, vous attestez que la remise a eu lieu comme indiqué. Elle sera transmise au superviseur pour validation.')}</div></div>
      ${nav(t('Confirmer la remise'), 'gold')}`);

    U.$('#next').onclick = async () => {
      if (Store.activeDist(id, type)) return UI.toast(t('Déjà remis.'), 'bad');
      U.$('#next').disabled = true;
      const d = {
        id: U.uid('D'), hhId: id, cep: h.cep, type, date: U.now(), agent: S.user.id, agentNom: S.user.nom, device: S.device,
        receveur: { type: W.receveur.type, nom: W.receveur.nom, lien: W.receveur.lien, tel: W.receveur.tel, photo: W.receveur.photo },
        items: type === 'semences' ? W.items.map(({ code, nom, unite, prevu, remis }) => ({ code, nom, unite, prevu, remis: +remis })) : undefined,
        kitNom: W.kitNom,
        animaux: type === 'betail' ? W.animaux.map(({ code, nom, prevuM, prevuF, m, f, sante, obs }) => ({ code, nom, prevuM, prevuF, m: +m, f: +f, sante, obs })) : undefined,
        ecart: ecart(), ecartMotif: ecart() ? W.ecartMotif : '', ecartComment: ecart() ? W.ecartComment : '',
        preuves: { qr: !!W.qr, identMotif: W.qr ? '' : W.identMotif, photo: P.photo, signature: P.signature, empreinte: P.empreinte, gps: P.gps, gpsErr: P.gps ? '' : `${P.gpsErr} — ${P.gpsWhy}`, consent: W.consent },
        obs: U.$('#obs').value.trim(), statut: 'en_attente',
      };
      await Store.saveDist(d, 'remise-' + type);
      if (!h.profil || !h.profil.consent) { h.profil = { ...(h.profil || {}), consent: true, consentDate: U.now() }; await Store.saveHh(h, 'consentement'); }
      Views.W = null;
      const s = Store.statusOf(h);
      const other = type === 'semences' ? 'betail' : 'semences';
      const r = await UI.modal({
        title: '✓ ' + t('Remise enregistrée'),
        body: `<p>${U.esc(h.nom)} — ${t(type === 'semences' ? 'Kit de semences' : 'Petit bétail')}.</p>${!s[other === 'betail' ? 'bet' : 'sem'] ? `<p class="alert warn small">${t(other === 'betail' ? 'Le petit bétail n\'a pas encore été remis à ce ménage.' : 'Le kit de semences n\'a pas encore été remis à ce ménage.')}</p>` : ''}${!(h.profil && h.profil.completedAt) ? `<p class="alert info small">${t('Ce ménage n\'est pas encore profilé.')}</p>` : ''}`,
        actions: [{ label: t('Voir la fiche'), value: 'fiche' }, ...(!(h.profil && h.profil.completedAt) ? [{ label: t('Profiler'), value: 'profil' }] : []),
          ...(!s[other === 'betail' ? 'bet' : 'sem'] ? [{ label: t(other === 'betail' ? 'Remettre le bétail' : 'Remettre les semences'), value: 'other' }] : []),
          { label: t('Ménage suivant'), cls: 'primary', value: 'next' }],
      });
      if (r === 'other') { Views.W = { hhId: id, type: other, qr: d.preuves.qr, identMotif: d.preuves.identMotif, step: 1 }; location.hash = `#/d/${encodeURIComponent(id)}/${other}`; }
      else if (r === 'fiche') location.hash = '#/m/' + encodeURIComponent(id);
      else if (r === 'profil') location.hash = '#/m/' + encodeURIComponent(id) + '/profil';
      else location.hash = '#/distribuer';
      if (location.hash === '#/distribuer') render();
    };
  },

  /* ======================= VALIDATION (SUPERVISEUR) ======================= */
  async validation() {
    const f = Q().get('f') || 'en_attente';
    const all = [...S.dist.values()].sort((a, b) => b.date - a.date);
    const list = all.filter((d) => (f === 'anomalies' ? d.statut !== 'rejetee' && Store.anomalies(d).length : d.statut === f));
    const cnt = (k) => (k === 'anomalies' ? all.filter((d) => d.statut !== 'rejetee' && Store.anomalies(d).length).length : all.filter((d) => d.statut === k).length);
    const shown = list.slice(0, 40);
    const cards = await Promise.all(shown.map(async (d) => {
      const h = S.hh.get(d.hhId) || { nom: '?', id: d.hhId }, c = S.ceps.get(h.cep) || {};
      const pr = d.preuves || {};
      const imgs = await Promise.all([pr.photo, pr.signature, pr.empreinte, d.receveur && d.receveur.photo].map((m) => Store.media(m)));
      const an = Store.anomalies(d);
      return `<div class="card" data-d="${d.id}"><div class="row between"><div><b>${U.esc(h.nom)}</b> <span class="mono small muted">${U.esc(h.id)}</span><div class="small muted">${U.esc(c.nom || '')} · ${t(d.type === 'semences' ? 'Kit de semences' : 'Petit bétail')} · ${U.fmtDate(d.date)} · ${U.esc(d.agentNom)}</div></div>${UI.badgeStatut(d.statut)}</div>
        <div class="small" style="margin:6px 0">${d.type === 'semences' ? (d.items || []).map((i) => `${U.esc(t(i.nom))} <b>${i.remis}</b>${i.prevu != null ? '/' + i.prevu : ''}`).join(' · ') : (d.animaux || []).map((a) => `${U.esc(t(a.nom))} <b>${a.m}♂${a.f}♀</b> ${a.sante !== 'bon' ? `<span class="badge ${a.sante === 'malade' ? 'bad' : 'warn'}">${t((SANTE.find((x) => x[0] === a.sante) || [])[1])}</span>` : ''}`).join(' · ')}</div>
        <div class="small">${t('Reçu par')} : ${d.receveur.type === 'mandataire' ? `<b>${t('mandataire')} ${U.esc(d.receveur.nom)}</b> (${U.esc(t(d.receveur.lien))})` : t('le bénéficiaire')} · GPS : ${Geo.link(pr.gps)}${pr.gps ? '' : ' ' + U.esc(pr.gpsErr || '')}</div>
        ${d.ecart ? `<div class="small"><span class="badge warn">${t('Écart')}</span> ${U.esc(t(d.ecartMotif))} — ${U.esc(d.ecartComment)}</div>` : ''}
        ${!pr.qr ? `<div class="small"><span class="badge warn">${t('Identification manuelle')}</span> ${U.esc(t(pr.identMotif || ''))}</div>` : ''}
        ${d.obs ? `<div class="small muted">${U.esc(d.obs)}</div>` : ''}
        ${an.length ? `<div style="margin-top:4px">${an.map((x) => `<span class="badge warn">${t(x)}</span>`).join(' ')}</div>` : ''}
        <div class="thumbs" style="margin:8px 0">${imgs.filter(Boolean).map((s) => `<img src="${s}" data-lb>`).join('')}</div>
        ${d.validation ? `<div class="small muted">${t(d.statut === 'rejetee' ? 'Rejetée' : 'Validée')} ${t('par')} ${U.esc(d.validation.parNom)} · ${U.fmtDate(d.validation.date)} ${U.esc(d.validation.commentaire || '')}</div>` : ''}
        <div class="row" style="justify-content:flex-end">${d.statut !== 'validee' ? `<button class="btn sm primary" data-act="ok">✓ ${t('Valider')}</button>` : ''}${d.statut !== 'rejetee' ? `<button class="btn sm" data-act="ko" style="color:var(--bad)">${t('Rejeter')}</button>` : ''}<a class="btn sm ghost" href="#/m/${encodeURIComponent(h.id)}">${t('Fiche')}</a></div></div>`;
    }));
    const clean = list.filter((d) => d.statut === 'en_attente' && !Store.anomalies(d).length);
    await shell(`<div class="page-head"><div><div class="kicker">${t('Superviseur')}</div><h1>${t('Validation des remises')}</h1><div class="sub">${t('Contrôlez les preuves avant de valider.')}</div></div>
      ${f === 'en_attente' && clean.length ? `<button class="btn primary" id="bulk">✓ ${t('Valider les {n} remises sans anomalie', { n: clean.length })}</button>` : ''}</div>
      ${(() => { const n = [...S.hh.values()].reduce((s, h) => s + (h.corrections || []).filter((c) => !c.revue).length, 0); return n ? `<div class="alert warn small" style="margin-bottom:12px">${t("{n} corrections d'identité à contrôler.", { n })} <a href="#/corrections">${t('Voir')}</a></div>` : ''; })()}
      <div class="seg" style="margin-bottom:14px">${[['en_attente', 'En attente'], ['anomalies', 'Anomalies'], ['validee', 'Validées'], ['rejetee', 'Rejetées']].map(([k, l]) => `<label><input type="radio" name="vf" value="${k}" ${k === f ? 'checked' : ''}>${t(l)} (${cnt(k)})</label>`).join('')}</div>
      ${cards.join('') || `<p class="muted">${t('Rien à afficher.')}</p>`}${list.length > 40 ? `<p class="muted small">${t('{n} autres remises : validez les premières pour voir la suite.', { n: list.length - 40 })}</p>` : ''}`);
    U.$$('input[name=vf]').forEach((r) => (r.onchange = () => (location.hash = '#/validation?f=' + r.value)));
    U.$$('[data-lb]').forEach((i) => (i.onclick = () => UI.lightbox(i.src)));
    const decide = async (d, statut, commentaire = '') => { d.statut = statut; d.validation = { par: S.user.id, parNom: S.user.nom, date: U.now(), commentaire }; await Store.saveDist(d, statut === 'validee' ? 'validation' : 'rejet'); };
    U.$$('[data-act]').forEach((b) => (b.onclick = async () => {
      const d = S.dist.get(b.closest('[data-d]').dataset.d);
      if (b.dataset.act === 'ok') {
        const an = Store.anomalies(d);
        let com = '';
        if (an.length) {
          com = await UI.modal({ title: t('Valider malgré les anomalies ?'), body: `<p>${an.map((x) => `<span class="badge warn">${t(x)}</span>`).join(' ')}</p><label class="field"><span>${t('Commentaire de validation')} <b class="req">*</b></span><textarea id="c"></textarea></label>`,
            actions: [{ label: t('Annuler'), value: null }, { label: t('Valider'), cls: 'primary', onClick: (el) => { const v = U.$('#c', el).value.trim(); if (v.length < 3) { UI.toast(t('Commentaire requis'), 'bad'); return false; } return v; } }] });
          if (!com) return;
        }
        await decide(d, 'validee', com);
      } else {
        const why = await UI.modal({ title: t('Rejeter la remise'), body: `<p class="small">${t('Le ménage redeviendra « non servi » pour ce lot et pourra être servi à nouveau.')}</p><label class="field"><span>${t('Motif du rejet')} <b class="req">*</b></span><textarea id="c"></textarea></label>`,
          actions: [{ label: t('Annuler'), value: null }, { label: t('Rejeter'), cls: 'danger', onClick: (el) => { const v = U.$('#c', el).value.trim(); if (v.length < 3) { UI.toast(t('Motif requis'), 'bad'); return false; } return v; } }] });
        if (!why) return;
        await decide(d, 'rejetee', why);
      }
      UI.toast(t('Enregistré'), 'ok'); Views.validation();
    }));
    const bulk = U.$('#bulk');
    if (bulk) bulk.onclick = async () => { if (!(await UI.confirm(t('Valider {n} remises sans anomalie ?', { n: clean.length })))) return; for (const d of clean) await decide(d, 'validee', t('Validation groupée')); UI.toast(t('Enregistré'), 'ok'); Views.validation(); };
  },

  exportExcel(terr) {

  async importFile(after) {
    const f = await Views.pickFile('.kyf,.json,application/octet-stream,application/json');
    if (!f) return;
    try {
      let obj = JSON.parse(await f.text());
      if (obj.enc) {
        if (!Crypto.available()) throw new Error(t('Ce navigateur ne peut pas déchiffrer le fichier.'));
        const pw = await UI.modal({ title: t('Fichier protégé'), body: `<label class="field"><span>${t('Mot de passe du fichier')}</span><input type="password" id="pw"></label>`, actions: [{ label: t('Annuler'), value: null }, { label: t('Ouvrir'), cls: 'primary', onClick: (el) => U.$('#pw', el).value }] });
        if (!pw) return;
        try { obj = JSON.parse(await Crypto.decrypt(obj, pw)); } catch (e) { throw new Error(t('Mot de passe incorrect.')); }
      }
      const st = await Store.importPack(obj);
      UI.toast(t('Import réussi : {m} ménages, {d} remises, {p} photos, {u} utilisateurs.', { m: st.menages, d: st.distributions, p: st.photos, u: st.utilisateurs }), 'ok');
      if (after) after();
    } catch (e) { UI.toast(t('Import impossible') + ' : ' + e.message, 'bad'); }
  },
  async importExcel() {
    const f = await Views.pickFile('.xlsx');
    if (!f) return;
    try {
      const sheets = await XLSX.read(await f.arrayBuffer());
      const added = [], skipped = [], newCeps = [];
      for (const sh of sheets) {
        const hi = sh.rows.findIndex((r) => r.some((c) => /nom/i.test(String(c || ''))) && r.some((c) => /cep/i.test(String(c || ''))));
        if (hi < 0) continue;
        const hd = sh.rows[hi].map((c) => U.norm(c));
        const col = (re) => hd.findIndex((h) => re.test(h));
        const C = { terr: col(/territ/), cep: col(/^cep|code cep/), nom: col(/nom/), sexe: col(/sexe/), age: col(/^age/), village: col(/village|lieu/), tel: col(/tel/), carte: col(/carte/) };
        for (const r of sh.rows.slice(hi + 1)) {
          const nom = String(r[C.nom] || '').trim().toUpperCase();
          if (nom.length < 3) continue;
          const terr = String(r[C.terr] || '').trim() || 'Beni';
          const cepTxt = String(r[C.cep] || '').trim();
          let cep = S.ceps.get(cepTxt.toUpperCase()) || [...S.ceps.values()].find((c) => U.norm(c.nom) === U.norm(cepTxt) && (!terr || U.norm(c.territoire) === U.norm(terr)));
          if (!cep && cepTxt) {
            const code = U.norm(terr).startsWith('lub') ? 'LB' : 'BN';
            const n = Math.max(0, ...[...S.ceps.values()].filter((c) => c.id.startsWith(code)).map((c) => +c.id.slice(2) || 0)) + 1;
            cep = { id: `${code}${String(n).padStart(2, '0')}`, nom: cepTxt.toUpperCase(), territoire: code === 'LB' ? 'Lubero' : 'Beni', village: String(r[C.village] || ''), facilitateur: '', jour: '', speculation: '', kit: '', _src: 'import' };
            await Store.saveCep(cep); newCeps.push(cep.nom);
          }
          if (!cep) { skipped.push(nom); continue; }
          if ([...S.hh.values()].some((h) => h.cep === cep.id && U.norm(h.nom) === U.norm(nom))) { skipped.push(nom); continue; }
          const sx = String(r[C.sexe] || '').trim().toUpperCase()[0];
          const h = { id: Store.newHouseholdId(cep.id), cep: cep.id, territoire: cep.territoire, nom, sexe: sx === 'F' || sx === 'M' ? sx : '', age: +r[C.age] || '', ageTranche: '', lieu: '', village: String(r[C.village] || ''), tel: String(r[C.tel] || ''), carte: String(r[C.carte] || ''), presence: '', verifier: [], profil: {}, _src: 'import-excel' };
          await Store.saveHh(h, 'menage-importe'); added.push(h.id);
        }
      }
      UI.modal({ title: t('Import Excel terminé'), body: `<p>${t('{a} ménages ajoutés, {s} ignorés (déjà présents ou sans CEP).', { a: added.length, s: skipped.length })}</p>${newCeps.length ? `<p>${t('Nouveaux CEP')} : ${newCeps.map(U.esc).join(', ')}</p><p class="small muted">${t('Pensez à leur affecter un kit dans Paramètres.')}</p>` : ''}`, actions: [{ label: 'OK', cls: 'primary' }] });
    } catch (e) { UI.toast(t('Import impossible') + ' : ' + e.message, 'bad'); }
  },

    const readKits = () => {

      if (!nom) return; readKits(); st.kits[U.slug(nom) || U.uid('k')] = { nom, items: [] }; Views.parametres();

    U.$('#save').onclick = async () => {

      U.$$('[data-am]').forEach((i) => (st.animaux[+i.dataset.am].m = +i.value || 0));
      U.$$('[data-af]').forEach((i) => (st.animaux[+i.dataset.af].f = +i.value || 0));
      for (const sel of U.$$('[data-cepkit]')) { const c = S.ceps.get(sel.dataset.cepkit); if ((c.kit || '') !== sel.value) { c.kit = sel.value; await Store.saveCep(c); } }
      await Store.saveSettings(st); UI.toast(t('Paramètres enregistrés'), 'ok');

    U.$('#adduser').onclick = () => UI.modal({
      title: t('Ajouter un utilisateur'),

      actions: [{ label: t('Annuler'), value: null }, { label: t('Créer'), cls: 'primary', onClick: async (el) => {

        const salt = U.rand(12);
        const u = { id: U.uid('U'), nom, role: U.$('#r', el).value, salt, pin: hashPin(pin, salt), actif: true };
        await Store.saveUser(u); await Store.audit('creation-utilisateur', u.id, nom); Views.parametres();
      } }],
    });
    U.$$('[data-reset]').forEach((b) => (b.onclick = () => Views.changePin(S.users.get(b.dataset.reset))));
    U.$$('[data-toggle]').forEach((b) => (b.onclick = async () => { const u = S.users.get(b.dataset.toggle); u.actif = u.actif === false; await Store.saveUser(u); await Store.audit(u.actif ? 'activation-utilisateur' : 'desactivation-utilisateur', u.id); Views.parametres(); }));
    U.$('#wipe').onclick = async () => {
      const ok = await UI.modal({ title: t('Effacer toutes les données'), body: `<div class="alert bad small">${t('Toutes les données de cet appareil (remises, photos, profils, utilisateurs) seront définitivement supprimées. Exportez une sauvegarde complète avant.')}</div><label class="field" style="margin-top:10px"><span>${t('Tapez EFFACER pour confirmer')}</span><input type="text" id="w"></label>`,
        actions: [{ label: t('Annuler'), value: false }, { label: t('Effacer'), cls: 'danger', onClick: (el) => U.$('#w', el).value.trim() === 'EFFACER' || (UI.toast(t('Confirmation incorrecte'), 'bad'), false) }] });

  async plus() {

/* Photo pour la carte + vérification / correction de l'identité, séance photo par CEP, contrôle des corrections. */
const MOTIFS_NOM = ['Erreur de transcription de la fiche', 'Orthographe donnée par le bénéficiaire', "Nom vérifié sur la carte d'électeur", 'Post-nom ou prénom ajouté', 'Autre'];
const ID_FIELDS = [['nom', 'Nom et post-nom'], ['sexe', 'Sexe'], ['age', 'Âge'], ['tel', 'Téléphone'], ['carte', "N° carte d'électeur"], ['village', 'Village / localité']];

Object.assign(Views, {
  /* Fenêtre de prise de photo et de vérification de l'identité. Retourne true si enregistré. */
  async verifyIdentity(id) {
    const h = S.hh.get(id);
    if (!h) return false;
    let photo = await Store.media(h.photo), newPhoto = null;
    const ver = (k) => ((h.verifier || []).includes(k) ? ` <span class="badge warn">${t('à vérifier')}</span>` : '');
    const hist = (h.corrections || []).slice(-3).reverse();
    return UI.modal({
      title: t("Photo et vérification d'identité"),
      body: `<p class="small muted mono">${U.esc(h.id)} · ${U.esc((S.ceps.get(h.cep) || {}).nom || '')}</p>
        <div class="row" style="align-items:flex-start;gap:14px">
          <div class="photo-slot ${photo ? 'filled' : ''}" id="vi-ph" style="width:130px;min-height:160px;flex-shrink:0">${photo ? `<img src="${photo}">` : `${IC.camera}<div><b>${t('Prendre la photo')}</b><div class="small muted">${t('visage de face, fond clair')}</div></div>`}</div>
          <div style="flex:1;min-width:250px">
            ${h.verifier && h.verifier.length ? `<div class="alert warn small" style="margin-bottom:8px">${t('Écriture incertaine sur la fiche source : faites épeler le nom par le bénéficiaire et comparez avec sa carte d\'électeur.')}</div>` : ''}
            <label class="field"><span>${t('Nom et post-nom')}${ver('nom')}</span><input type="text" id="vi-nom" value="${U.esc(h.nom)}" autocomplete="off" style="text-transform:uppercase;font-weight:800"></label>
            <div class="field hidden" id="vi-mo-w"><span>${t('Motif de la correction du nom')} <b class="req">*</b></span><select id="vi-mo"><option value="">—</option>${UI.opt(MOTIFS_NOM.map((x) => [x, t(x)]))}</select>
              <div class="small" style="margin-top:4px">${t('Ancien nom')} : <b>${U.esc(h.nom)}</b></div></div>
          </div></div>
        <div class="form-grid">
          <label class="field"><span>${t('Sexe')}${ver('sexe')}</span><div class="seg"><label><input type="radio" name="vi-sx" value="F" ${h.sexe === 'F' ? 'checked' : ''}>${t('Femme')}</label><label><input type="radio" name="vi-sx" value="M" ${h.sexe === 'M' ? 'checked' : ''}>${t('Homme')}</label></div></label>
          <label class="field"><span>${t('Âge')}${ver('age')}</span><input type="number" id="vi-age" min="12" max="110" inputmode="numeric" value="${h.age || ''}" placeholder="${U.esc(h.ageTranche || '')}"></label>
          <label class="field"><span>${t('Téléphone')}${ver('tel')}</span><input type="tel" id="vi-tel" value="${U.esc(h.tel || '')}"></label>
          <label class="field"><span>${t("N° carte d'électeur")}${ver('carte')}</span><input type="text" id="vi-carte" inputmode="numeric" value="${U.esc(h.carte || '')}"></label>
          <label class="field"><span>${t('Village / localité')}${ver('village')}</span><input type="text" id="vi-vil" value="${U.esc(h.village || h.lieu || '')}"></label>
        </div>
        <label class="check"><input type="checkbox" id="vi-cons" ${h.profil && h.profil.consent ? 'checked' : ''}><span>${t('Le bénéficiaire accepte la photo pour sa carte et le suivi du projet.')}<br><i class="muted small">Mnufaika anakubali picha yake kwa ajili ya kadi na ufuatiliaji wa mradi.</i></span></label>
        <label class="check" style="margin-top:6px"><input type="checkbox" id="vi-ok"><span><b>${t('J\'ai vérifié ces informations avec le bénéficiaire.')}</b></span></label>
        ${hist.length ? `<h3>${t('Corrections précédentes')}</h3><div class="small">${hist.map((c) => `${U.fmtDate(c.date)} · ${U.esc(c.parNom)} : ${Object.entries(c.champs).map(([k, [a, b]]) => `${t((ID_FIELDS.find((f) => f[0] === k) || [, k])[1])} « ${U.esc(a || '—')} » → « ${U.esc(b || '—')} »`).join(' ; ')}`).join('<br>')}</div>` : ''}`,
      actions: [{ label: t('Annuler'), value: false }, { label: t('Enregistrer'), cls: 'primary', onClick: async (el) => {
        const g = (s) => U.$(s, el);
        const nom = g('#vi-nom').value.trim().toUpperCase().replace(/\s+/g, ' ');
        const vals = { nom, sexe: (U.$('input[name=vi-sx]:checked', el) || {}).value || h.sexe, age: g('#vi-age').value ? +g('#vi-age').value : h.age || '', tel: g('#vi-tel').value.trim(), carte: g('#vi-carte').value.trim(), village: g('#vi-vil').value.trim() };
        if (nom.length < 3) { UI.toast(t('Indiquez le nom complet'), 'bad'); return false; }
        if (nom !== h.nom && !g('#vi-mo').value) { UI.toast(t('Indiquez le motif de la correction du nom.'), 'bad'); return false; }
        if (newPhoto && !g('#vi-cons').checked) { UI.toast(t('Le consentement est requis pour enregistrer la photo ou la position.'), 'bad'); return false; }
        if (!g('#vi-ok').checked) { UI.toast(t('Cochez la case de vérification avec le bénéficiaire.'), 'bad'); return false; }
        if (vals.carte && vals.carte !== h.carte) {
          const dup = [...S.hh.values()].find((x) => x.id !== h.id && x.carte && x.carte === vals.carte);
          if (dup) { UI.toast(t('Ce n° de carte d\'électeur est déjà enregistré pour {n} ({id}).', { n: dup.nom, id: dup.id }), 'bad'); return false; }
        }
        const champs = {};
        const cur = { ...h, village: h.village || h.lieu || '' };
        ID_FIELDS.forEach(([k]) => { if (String(cur[k] ?? '') !== String(vals[k] ?? '')) champs[k] = [cur[k] ?? '', vals[k] ?? '']; });
        Object.assign(h, vals);
        if (newPhoto) h.photo = await Store.putMedia(newPhoto, 'portrait');
        if (g('#vi-cons').checked) h.profil = { ...(h.profil || {}), consent: true, consentDate: (h.profil && h.profil.consentDate) || U.now() };
        if (Object.keys(champs).length) {
          h.corrections = [...(h.corrections || []), { id: U.uid('C'), date: U.now(), par: S.user.id, parNom: S.user.nom, champs, motif: champs.nom ? g('#vi-mo').value : '', revue: null }];
        }
        h.verifier = [];
        h.identite = { verifiee: true, date: U.now(), par: S.user.id, parNom: S.user.nom };
        await Store.saveHh(h, Object.keys(champs).length ? 'correction-identite' : 'verification-identite');
        if (champs.nom) await Store.audit('correction-nom', h.id, `${champs.nom[0]} -> ${champs.nom[1]} (${g('#vi-mo').value})`);
        UI.toast(t('Enregistré'), 'ok');
        return true;
      } }],
      onOpen: (el) => {
        const nomInp = U.$('#vi-nom', el);
        nomInp.oninput = () => U.$('#vi-mo-w', el).classList.toggle('hidden', nomInp.value.trim().toUpperCase().replace(/\s+/g, ' ') === h.nom);
        U.$('#vi-ph', el).onclick = async () => {
          const d = await Camera.photo(720, 0.72);
          if (d) { newPhoto = d; U.$('#vi-ph', el).innerHTML = `<img src="${d}">`; U.$('#vi-ph', el).classList.add('filled'); U.$('#vi-cons', el).checked = true; }
        };
      },
    });
  },

  /* Séance photo par CEP : on enchaîne les ménages non vérifiés. */
  async photos() {
    const qp = Q();
    const terr = qp.get('t') || '', cep = qp.get('cep') || '';
    const list = cep ? [...S.hh.values()].filter((h) => h.cep === cep).sort((a, b) => a.id.localeCompare(b.id)) : [];
    const done = list.filter((h) => h.identite && h.identite.verifiee).length, withPh = list.filter((h) => h.photo).length;
    const next = list.find((h) => !(h.identite && h.identite.verifiee));
    await shell(`<div class="page-head"><div><div class="kicker"><a href="#/cartes">${t('Cartes')}</a></div><h1>${t('Séance photo et vérification')}</h1><div class="sub">${t('Prenez la photo de chaque membre et corrigez son nom si nécessaire, avant d\'imprimer les cartes.')}</div></div></div>
      <div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><select id="p-t"><option value="">${t('Tous territoires')}</option>${UI.opt(Views.terrs(), terr)}</select>
        <select id="p-cep"><option value="">${t('Choisir un CEP')}</option>${UI.opt(Views.cepsOf(terr).map((c) => [c.id, `${c.nom} (${c.id})`]), cep)}</select></div>
      ${cep ? `<div class="card"><div class="row between"><div><b>${withPh}</b>/${list.length} ${t('photos')} · <b>${done}</b>/${list.length} ${t('identités vérifiées')}</div>
          ${next ? `<button class="btn primary" id="p-next">${IC.camera} ${t('Membre suivant')}</button>` : `<span class="badge ok">${t('CEP terminé')}</span> <a class="btn sm" href="#/cartes?t=${terr}&cep=${cep}">${IC.print} ${t('Imprimer les cartes')}</a>`}</div>
          <div class="progress" style="margin-top:8px"><div style="width:${U.pct(done, list.length)}%"></div></div></div>
        <div class="list" style="margin-top:12px">${(await Promise.all(list.map(async (h) => {
          const ph = await Store.media(h.photo);
          const ok = h.identite && h.identite.verifiee;
          return `<button class="item" data-id="${U.esc(h.id)}" style="text-align:left;cursor:pointer"><div class="av">${ph ? `<img src="${ph}">` : U.esc(U.initials(h.nom))}</div><div class="main"><div class="t">${U.esc(h.nom)}</div><div class="m mono">${U.esc(h.id)}</div></div>
            <div class="side">${ok ? `<span class="badge ok">✓ ${t('vérifié')}</span>` : h.verifier && h.verifier.length ? `<span class="badge warn">${t('à vérifier')}</span>` : `<span class="badge">${t('à faire')}</span>`}${h.corrections && h.corrections.length ? `<span class="badge info">${t('corrigé')}</span>` : ''}${ph ? '' : `<span class="badge bad">${t('sans photo')}</span>`}</div></button>`;
        }))).join('')}</div>` : `<p class="muted">${t('Choisissez un CEP pour commencer.')}</p>`}`);

const UI = {
  toast(msg, kind = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind; el.textContent = msg;
    U.$('#toast-root').appendChild(el);
    setTimeout(() => el.remove(), kind === 'bad' ? 5000 : 3000);
  },
  modal({ title, body, actions = [], onOpen, wide }) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${wide ? 'style="max-width:900px"' : ''}><h2>${title}</h2><div class="mb">${body}</div><div class="actions">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
      U.$('#modal-root').appendChild(back);
      const close = (v) => { back.remove(); resolve(v); };
      back.addEventListener('click', async (e) => {
        if (e.target === back && !actions.some((a) => a.required)) return close(null);
        const b = e.target.closest('[data-i]');
        if (!b) return;
        const a = actions[+b.dataset.i];
        if (a.onClick) { const r = await a.onClick(back); if (r === false) return; close(r === undefined ? a.value : r); }
        else close(a.value);
      });
      if (onOpen) onOpen(back, close);
    });
  },
  confirm(text, okLabel = t('Confirmer'), cls = 'primary') {
    return UI.modal({ title: t('Confirmation'), body: `<p>${text}</p>`, actions: [{ label: t('Annuler'), value: false }, { label: okLabel, value: true, cls }] });
  },
  lightbox(src) {
    const el = document.createElement('div');

const Camera = {
  /* Prend une photo (appareil photo du téléphone) et la réduit pour limiter la taille. */
  photo(maxSide = 1024, quality = 0.62) {
    return new Promise((resolve) => {
      const inp = U.$('#file-camera');
      inp.value = '';
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      inp.onchange = async () => {
        const f = inp.files && inp.files[0];
        if (!f) return finish(null);
        try { finish(await Camera.resize(f, maxSide, quality)); } catch (e) { UI.toast(t('Photo illisible'), 'bad'); finish(null); }
      };
      inp.oncancel = () => finish(null);
      inp.click();
    });
  },
  resize(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0, c.width, c.height);
        const d = new Date();
        g.font = `${Math.max(12, Math.round(c.width / 40))}px sans-serif`;
        const label = `KYF ${U.fmtDate(d.getTime())} ${S.user ? S.user.nom : ''}`;
        const w = g.measureText(label).width;
        g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - Math.round(c.width / 40) - 12, w + 16, Math.round(c.width / 40) + 12);
        g.fillStyle = '#fff'; g.fillText(label, 8, c.height - 8);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  },
};

const Geo = {
  get(timeout = 25000) {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error(t('GPS non disponible sur cet appareil')));
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy), ts: p.timestamp || U.now() }),
        (e) => reject(new Error(e.code === 1 ? t('Autorisation GPS refusée') : e.code === 3 ? t('Délai GPS dépassé') : t('Position introuvable'))),
        { enableHighAccuracy: true, timeout, maximumAge: 120000 });
    });
  },
  link: (g) => g ? `<a href="geo:${g.lat},${g.lon}" class="mono">${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}</a> <span class="muted small">±${g.acc} m</span>` : `<span class="badge bad">${t('Sans GPS')}</span>`,
};

const QRScan = {
  supported: () => 'BarcodeDetector' in window,
  parse(txt) { const m = String(txt || '').toUpperCase().match(/KYF-[A-Z]{2}-\d{2}-[A-Z0-9]{3,5}/); return m ? m[0] : null; },
  async scan() {
    if (!QRScan.supported()) {
      await UI.modal({ title: t('Lecture QR indisponible'), body: `<p>${t("Ce navigateur ne sait pas lire les QR codes. Utilisez Google Chrome sur Android, ou recherchez le ménage par nom / ID.")}</p>`, actions: [{ label: 'OK', cls: 'primary' }] });
      return null;
    }
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    let stream = null;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); } catch (e) { stream = null; }
    if (!stream) {
      UI.toast(t('Caméra directe indisponible : prenez une photo nette du QR code.'));
      const shot = await Camera.photo(1600, 0.9);
      if (!shot) return null;
      const img = new Image(); img.src = shot; await img.decode();
      const codes = await det.detect(img);
      const id = codes.map((c) => QRScan.parse(c.rawValue)).find(Boolean);
      if (!id) UI.toast(t('Aucun QR code KYF détecté sur la photo'), 'bad');
      return id || null;
    }
    return new Promise((resolve) => {
      let stop = false;
      const close = (v) => { stop = true; stream.getTracks().forEach((tr) => tr.stop()); resolve(v); };
      UI.modal({
        title: t('Scanner la carte du ménage'),
        body: `<div class="scanner"><div class="frame"><video playsinline muted></video></div><p class="muted small">${t('Placez le QR code (verso de la carte) dans le cadre.')}</p></div>`,
        actions: [{ label: t('Annuler'), value: null }],
        onOpen: (el, closeModal) => {
          const v = U.$('video', el);
          v.srcObject = stream; v.play();
          const loop = async () => {
            if (stop) return;
            try {
              const codes = await det.detect(v);
              const id = codes.map((c) => QRScan.parse(c.rawValue)).find(Boolean);
              if (id) { if (navigator.vibrate) navigator.vibrate(120); closeModal(id); return; }
            } catch (e) { /* image pas prête */ }
            setTimeout(loop, 220);
          };
          loop();
        },
      }).then(close);
    });
  },
};

function SigPad(canvas) {
  const g = canvas.getContext('2d');
  let drawing = false, empty = true, last = null;
  const fit = () => {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    g.scale(dpr, dpr); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0b2a6b';
    g.fillStyle = '#fff'; g.fillRect(0, 0, r.width, r.height);
  };
  fit();
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = pos(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; empty = false;
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  return { clear() { g.setTransform(1, 0, 0, 1, 0, 0); fit(); empty = true; }, isEmpty: () => empty, data: () => canvas.toDataURL('image/png') };
}
