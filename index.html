      <div class="note"><b>${t('Cette carte est personnelle.')}</b> ${t('Présentez-la à chaque distribution (kit de semences et petit bétail).')}<br><i>Kadi hii ni ya kibinafsi. Ionyeshe kila wakati wa kugawa mbegu na wanyama wadogo.</i></div>
      <div class="qr">${QR.svg(h.id, { quiet: 1 })}</div><div class="qrl">${U.esc(h.id)}</div>
      <div class="line"></div>
      <div class="mrz">${U.esc(mrz)}</div>
      <div class="vb">KILIMO<b>YA FURAHA</b><small>${t('SUIVI MEAL · TRAÇABILITÉ')}</small></div></div>`;
  },
};

const Print = {
  go(html, pageCss) {
    const root = U.$('#print-root');
    root.innerHTML = html;
    let st = U.$('#page-style');
    if (!st) { st = document.createElement('style'); st.id = 'page-style'; document.head.appendChild(st); }
    st.textContent = `@page { ${pageCss} }`;
    document.body.classList.add('printing');
    const imgs = U.$$('img', root);
    Promise.all(imgs.map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; })))).then(() => {
      setTimeout(() => {
        window.print();
        setTimeout(() => { document.body.classList.remove('printing'); root.innerHTML = ''; }, 800);
      }, 150);
    });
  },
  async cards(list) {
    let html = '';
    for (const h of list) {
      const photo = await Store.media(h.photo);
      html += `<div class="print-card-page">${Card.recto(h, photo)}</div><div class="print-card-page">${Card.verso(h)}</div>`;
    }
    Print.go(html, 'size: 85.6mm 54mm; margin: 0;');
    await Store.audit('impression-cartes', list.length === 1 ? list[0].id : `${list.length} cartes`);
  },
  a4(html) { Print.go(html, 'size: A4; margin: 12mm;'); },
  header(title, sub) {
    return `<div class="ph"><div><div class="k">${U.esc(S.settings.projet)} · ${t('Suivi des distributions')}</div><h1>${title}</h1><div>${sub || ''}</div></div><div class="logos">${Object.values(window.KYF_LOGOS || {}).map((s) => `<img src="${s}" alt="">`).join('')}</div></div>`;
  },
};

/* ---------- Connexion, verrouillage ---------- */
const Auth = {
  lastAct: U.now(), fails: 0, blockedUntil: 0,
  watch() {
    ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => (Auth.lastAct = U.now()), { passive: true }));
    setInterval(() => {
      const min = +(S.settings.verrouillageMin || 15);
      if (S.user && min > 0 && U.now() - Auth.lastAct > min * 60000) Auth.logout(t('Session verrouillée après inactivité'));
    }, 20000);
  },
  logout(msg) { S.user = null; try { sessionStorage.removeItem('kyf-user'); } catch (e) {} location.hash = '#/'; render(); if (msg) UI.toast(msg); },
  async login(u, pin) {
    if (U.now() < Auth.blockedUntil) { UI.toast(t('Trop d\'essais. Patientez une minute.'), 'bad'); return false; }
    if (hashPin(pin, u.salt) !== u.pin) {
      Auth.fails++;
      if (Auth.fails >= 5) { Auth.blockedUntil = U.now() + 60000; Auth.fails = 0; }
      UI.toast(t('Code PIN incorrect'), 'bad');
      return false;
    }
    Auth.fails = 0; S.user = u; Auth.lastAct = U.now();
    try { sessionStorage.setItem('kyf-user', u.id); } catch (e) {}
    await Store.audit('connexion', u.id);
    return true;
  },
  screenLogin() {
    const users = [...S.users.values()].filter((u) => u.actif !== false).sort((a, b) => a.nom.localeCompare(b.nom));
    const app = U.$('#app');
    app.innerHTML = `<div class="login"><div class="box">
      <div class="brand"><div class="logos">${Object.values(window.KYF_LOGOS || {}).map((s) => `<img src="${s}" alt="">`).join('')}</div>
      <div class="t">KILIMO <b>YA FURAHA</b></div><div class="muted small">${t('Profilage & suivi des distributions')} · ${U.esc(S.settings.partenaires)}</div></div>
      <div id="step1"><div class="field"><span>${t('Qui êtes-vous ?')}</span></div><div class="users-pick">${users.map((u) => `<button class="btn block" data-u="${u.id}">${IC.users}<span style="flex:1">${U.esc(u.nom)}</span><span class="badge ${u.role === 'superviseur' ? 'dark' : ''}">${t(u.role === 'superviseur' ? 'Superviseur' : 'Agent')}</span></button>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost sm" id="imp">${IC.sync} ${t('Importer un paquet de configuration')}</button><button class="btn ghost sm" id="lang">FR / SW</button></div></div>
      <div id="step2" class="hidden"><p style="text-align:center;font-weight:800" id="who"></p><div class="pin"><input type="password" inputmode="numeric" maxlength="8" autocomplete="off" id="pin" placeholder="••••"></div>
      <button class="btn primary block" id="go">${IC.lock} ${t('Se connecter')}</button><button class="btn ghost block" id="back" style="margin-top:6px">${t('Retour')}</button></div>
    </div></div>`;
    let sel = null;
    U.$$('[data-u]', app).forEach((b) => (b.onclick = () => {
      sel = S.users.get(b.dataset.u);
      U.$('#step1').classList.add('hidden'); U.$('#step2').classList.remove('hidden');
      U.$('#who').textContent = sel.nom; U.$('#pin').focus();
    }));
    const go = async () => { if (sel && (await Auth.login(sel, U.$('#pin').value))) { render(); } else U.$('#pin').value = ''; };
    U.$('#go').onclick = go;
    U.$('#pin').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    U.$('#back').onclick = () => Auth.screenLogin();
    U.$('#imp').onclick = () => Views.importFile(() => Auth.screenLogin());
    U.$('#lang').onclick = async () => { S.lang = S.lang === 'fr' ? 'sw' : 'fr'; await DB.kv('lang', S.lang); Auth.screenLogin(); };
  },
  screenSetup() {
    const app = U.$('#app');
    app.innerHTML = `<div class="login"><div class="box">
      <div class="brand"><div class="logos">${Object.values(window.KYF_LOGOS || {}).map((s) => `<img src="${s}" alt="">`).join('')}</div>
      <div class="t">KILIMO <b>YA FURAHA</b></div><div class="muted small">${t('Première utilisation de cet appareil')}</div></div>
      ${S.hh.size ? `<div class="alert info small" style="margin-bottom:12px">${t('Registre intégré :')} <b>${S.hh.size}</b> ${t('ménages')} · <b>${S.ceps.size}</b> CEP.</div>`
        : `<div class="alert warn small" style="margin-bottom:12px">${t('Aucun registre sur cet appareil : importez le paquet de configuration du superviseur.')}</div>`}
      <p class="small"><b>${t('Téléphone d\'un agent ?')}</b> ${t('Importez le paquet de configuration préparé par le superviseur.')}</p>
      <button class="btn block" id="imp">${IC.sync} ${t('Importer un paquet de configuration')}</button>
      <div class="reading"></div>
      <p class="small"><b>${t('Poste du superviseur ?')}</b> ${t('Créez le compte superviseur.')}</p>
      <label class="field"><span>${t('Nom complet')}</span><input type="text" id="nom" autocomplete="name"></label>
      <label class="field"><span>${t('Code PIN (4 à 8 chiffres)')}</span><input type="password" inputmode="numeric" id="p1" maxlength="8" autocomplete="new-password"></label>
      <label class="field"><span>${t('Confirmer le code PIN')}</span><input type="password" inputmode="numeric" id="p2" maxlength="8" autocomplete="new-password"></label>
      <button class="btn primary block" id="create">${t('Créer le compte superviseur')}</button>
    </div></div>`;
    U.$('#imp').onclick = () => Views.importFile(() => render());
    U.$('#create').onclick = async () => {
      const nom = U.$('#nom').value.trim(), p1 = U.$('#p1').value, p2 = U.$('#p2').value;
      if (nom.length < 3) return UI.toast(t('Indiquez le nom complet'), 'bad');
      if (!/^\d{4,8}$/.test(p1)) return UI.toast(t('Le PIN doit contenir 4 à 8 chiffres'), 'bad');
      if (p1 !== p2) return UI.toast(t('Les deux PIN ne correspondent pas'), 'bad');
      const salt = U.rand(12);
      const u = { id: U.uid('U'), nom, role: 'superviseur', salt, pin: hashPin(p1, salt), actif: true };
      await Store.saveUser(u);
      S.user = u;
      try { sessionStorage.setItem('kyf-user', u.id); } catch (e) {}
      await Store.audit('creation-superviseur', u.id);
      location.hash = '#/'; render();
    };
  },
};

/* ---------- Mise en page & routeur ---------- */
const NAV = [
  ['#/', 'home', 'Accueil'], ['#/menages', 'users', 'Ménages'], ['#/distribuer', 'gift', 'Distribuer', 'primary'],
  ['#/validation', 'check', 'Validation', '', true], ['#/rapports', 'report', 'Rapports'], ['#/cartes', 'card', 'Cartes'],
  ['#/sync', 'sync', 'Synchroniser'], ['#/parametres', 'gear', 'Paramètres'],
];
async function shell(content) {
  const path = location.hash.split('?')[0] || '#/';
  const act = (h) => (h === '#/' ? path === '#/' || path === '' : path.startsWith(h) || (h === '#/menages' && path.startsWith('#/m/')) || (h === '#/distribuer' && path.startsWith('#/d/')));
  const pending = await Store.pendingCount();
  const nav = NAV.filter((n) => !n[4] || UI.isSup());
  const bottom = UI.isSup() ? ['#/', '#/menages', '#/distribuer', '#/validation'] : ['#/', '#/menages', '#/distribuer', '#/sync'];
  U.$('#app').innerHTML = `
    <header class="topbar"><div class="logo"><span class="dot"></span>KILIMO <b>YA FURAHA</b></div><div class="spacer"></div>
      <button class="chip ${pending ? 'alert' : ''}" id="tb-sync" title="${t('Modifications non exportées')}">${IC.sync.replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')} ${pending}</button>
      <button class="chip" id="tb-lang">${S.lang.toUpperCase()}</button>
      <button class="chip" id="tb-user">${U.esc(S.user.nom.split(' ')[0])} ▾</button></header>
    <div class="layout"><nav class="sidenav">${nav.map((n, i) => `${i === 3 || (i === 4 && !UI.isSup()) ? '<div class="sep"></div>' : ''}<a href="${n[0]}" class="${act(n[0]) ? 'active' : ''}">${IC[n[1]]}${t(n[2])}</a>`).join('')}</nav>
    <main id="main">${content}</main></div>
    <nav class="bottomnav">${bottom.map((h) => { const n = NAV.find((x) => x[0] === h); return `<a href="${h}" class="${act(h) ? 'active' : ''} ${n[3] || ''}"><span class="ic">${IC[n[1]]}</span>${t(n[2])}</a>`; }).join('')}
      <a href="#/plus" class="${path === '#/plus' ? 'active' : ''}"><span class="ic">${IC.more}</span>${t('Plus')}</a></nav>`;
  U.$('#tb-sync').onclick = () => (location.hash = '#/sync');
  U.$('#tb-lang').onclick = async () => { S.lang = S.lang === 'fr' ? 'sw' : 'fr'; await DB.kv('lang', S.lang); render(); };
  U.$('#tb-user').onclick = () => UI.modal({
    title: U.esc(S.user.nom),
    body: `<p class="muted">${t(UI.isSup() ? 'Superviseur' : 'Agent')} · ${t('Appareil')} <span class="mono">${S.device}</span></p>`,
    actions: [{ label: t('Changer mon PIN'), onClick: () => Views.changePin(S.user) }, { label: t('Se déconnecter'), cls: 'primary', onClick: () => Auth.logout() }],
  });
  window.scrollTo(0, 0);
}

const ROUTES = [
  [/^#\/?$/, () => Views.dashboard()],
  [/^#\/menages$/, () => Views.menages()],
  [/^#\/m\/([^/]+)$/, (id) => Views.menage(decodeURIComponent(id))],
  [/^#\/m\/([^/]+)\/profil$/, (id) => Views.profilForm(decodeURIComponent(id))],
  [/^#\/nouveau$/, () => Views.profilForm(null)],
  [/^#\/distribuer$/, () => Views.distribuer()],
  [/^#\/d\/([^/]+)\/(semences|betail)$/, (id, type) => Views.wizard(decodeURIComponent(id), type)],
  [/^#\/validation$/, () => Views.validation(), true],
  [/^#\/cartes$/, () => Views.cartes()],
  [/^#\/photos$/, () => Views.photos()],
  [/^#\/corrections$/, () => Views.corrections(), true],
  [/^#\/rapports$/, () => Views.rapports()],
  [/^#\/sync$/, () => Views.sync()],
  [/^#\/parametres$/, () => Views.parametres()],
  [/^#\/plus$/, () => Views.plus()],
];
async function render() {
  if (!S.users.size) return Auth.screenSetup();
  if (!S.user) {
    let id = null;
    try { id = sessionStorage.getItem('kyf-user'); } catch (e) {}
    const u = id && S.users.get(id);
    if (u && u.actif !== false) S.user = u; else return Auth.screenLogin();
  }
  try {
    const h = location.hash.split('?')[0] || '#/';
    for (const [re, fn, supOnly] of ROUTES) {
      const m = h.match(re);
      if (m) {
        if (supOnly && !UI.isSup()) { await shell(`<div class="alert bad">${t('Accès réservé au superviseur.')}</div>`); return; }
        await fn(...m.slice(1)); return;
      }
    }
    await Views.dashboard();
  } catch (e) {
    console.error(e);
    U.$('#main') ? (U.$('#main').innerHTML = `<div class="alert bad">${t('Erreur')} : ${U.esc(e.message)}</div>`) : UI.toast(e.message, 'bad');
  }
}
window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', (e) => { if (Views.W && Views.W.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  try {
    await Store.init();
    document.documentElement.lang = S.lang;
    Auth.watch();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    render();
  } catch (e) {
    document.body.innerHTML = `<div style="padding:24px;font-family:sans-serif"><h2>Erreur de démarrage</h2><p>${U.esc(e.message)}</p><p>Ouvrez ce fichier avec Google Chrome (Android ou ordinateur). Le stockage local du navigateur doit être autorisé.</p></div>`;
  }
})();
</script>
</body>
</html>
