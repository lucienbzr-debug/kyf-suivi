<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123524">
<title>Kilimo ya Furaha · Suivi</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" onerror="this.remove()">
<style>:root {
  --bg: #f6f4ee; --panel: #ffffff; --panel-2: #f1efe7; --line: #e3dfd3;
  --ink: #17231b; --ink-2: #4b5a50; --ink-3: #7c887f;
  --brand: #123524; --brand-2: #1d5b3a; --gold: #f2b705;
  --ok: #1f9a55; --ok-bg: #e3f4ea; --warn: #d99a0b; --warn-bg: #fcf1d6; --bad: #cf4436; --bad-bg: #fbe4e1;
  --info: #1f6fb2; --info-bg: #e3eefa;
  --cyan: #19d9e8; --card-bg: #0a0e11;
  --radius: 12px; --shadow: 0 1px 2px rgba(20,30,20,.06), 0 4px 14px rgba(20,30,20,.06);
  --font: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, Arial, sans-serif;
  --mono: ui-monospace, "Roboto Mono", "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-2); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ---------- Structure ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--brand); color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-top: 4px solid var(--gold); }
.topbar .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .02em; font-size: 15px; white-space: nowrap; }
.topbar .logo .dot { width: 9px; height: 9px; border-radius: 50%; background: #3be38a; box-shadow: 0 0 8px #3be38a; }
.topbar .logo b { color: var(--gold); }
.topbar .spacer { flex: 1; }
.topbar .chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 99px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.topbar .chip.alert { background: var(--gold); color: #1a1a1a; border-color: var(--gold); font-weight: 700; }
.layout { display: flex; min-height: calc(100vh - 56px); }
.sidenav { display: none; }
main { flex: 1; min-width: 0; padding: 16px 16px 96px; max-width: 1180px; margin: 0 auto; width: 100%; }
.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
.bottomnav a { flex: 1; text-align: center; padding: 8px 2px 7px; font-size: 11px; color: var(--ink-2); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bottomnav a svg, .sidenav a svg { width: 22px; height: 22px; }
.bottomnav a.active { color: var(--brand-2); font-weight: 700; }
.bottomnav a.primary span.ic { background: var(--brand-2); color: #fff; border-radius: 14px; padding: 4px 12px; }
@media (min-width: 960px) {
  .bottomnav { display: none; }
  .sidenav { display: flex; flex-direction: column; gap: 2px; width: 220px; padding: 16px 10px; border-right: 1px solid var(--line); background: #fbfaf6; position: sticky; top: 60px; height: calc(100vh - 60px); }
  .sidenav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 600; }
  .sidenav a.active { background: var(--ok-bg); color: var(--brand); }
  .sidenav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
  main { padding: 24px 28px 48px; }
}

/* ---------- Composants ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 3px solid var(--brand); flex-wrap: wrap; }
.page-head .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #b07d00; font-weight: 800; }
.page-head h1 { font-size: 26px; font-weight: 850; color: var(--brand); letter-spacing: -.01em; }
.page-head .sub { color: var(--ink-2); font-size: 13.5px; }
.page-head .big { text-align: right; }
.page-head .big .n { font-size: 40px; font-weight: 900; color: var(--brand); line-height: 1; }
.page-head .big .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #b07d00; font-weight: 800; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.card + .card { margin-top: 14px; }
.card h2 { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
.card h3 { font-size: 14px; font-weight: 800; margin: 14px 0 8px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: 10px; padding: 12px 14px; }
.kpi .n { font-size: 30px; font-weight: 900; line-height: 1.05; }
.kpi .l { font-size: 12.5px; font-weight: 700; }
.kpi .s { font-size: 11.5px; color: var(--ink-3); }
.kpi.warn { border-left-color: var(--warn); } .kpi.warn .n { color: #a87400; }
.kpi.bad { border-left-color: var(--bad); } .kpi.bad .n { color: var(--bad); }
.kpi.ok .n { color: var(--ok); } .kpi.info { border-left-color: var(--info); } .kpi.info .n { color: var(--info); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); min-height: 44px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.btn.primary:hover { background: var(--brand); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1b1b1b; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.xl { min-height: 64px; font-size: 17px; border-radius: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 700; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: #13703d; } .badge.warn { background: var(--warn-bg); color: #8a5d00; }
.badge.bad { background: var(--bad-bg); color: #a22c20; } .badge.info { background: var(--info-bg); color: #16548a; }
.badge.dark { background: var(--brand); color: #fff; }
.alert { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; border: 1px solid; }
.alert.warn { background: var(--warn-bg); border-color: #f0d38c; color: #6d4b00; }
.alert.bad { background: var(--bad-bg); border-color: #f1b7b0; color: #8a2419; }
.alert.info { background: var(--info-bg); border-color: #b9d3ef; color: #16466f; }
.alert.ok { background: var(--ok-bg); border-color: #acdcbf; color: #125f35; }

/* Formulaires */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
.field > span .req { color: var(--bad); }
input[type=text], input[type=number], input[type=tel], input[type=password], input[type=search], input[type=date], select, textarea {
  width: 100%; border: 1px solid #d4cfbf; border-radius: 10px; padding: 10px 12px; background: #fff; min-height: 44px; }
textarea { min-height: 70px; }
input:focus, select:focus, textarea:focus { outline: 2px solid #9bd3b2; border-color: var(--ok); }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--brand-2); flex-shrink: 0; }
.seg { display: flex; border: 1px solid #d4cfbf; border-radius: 10px; overflow: hidden; }
.seg label { flex: 1; text-align: center; padding: 10px 6px; cursor: pointer; font-weight: 700; font-size: 14px; border-right: 1px solid #d4cfbf; background: #fff; }
.seg label:last-child { border-right: 0; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--brand-2); color: #fff; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 4px; margin: 0 0 14px; background: #fff; }
legend { font-weight: 800; padding: 0 6px; color: var(--brand); }

/* Listes */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-decoration: none; color: inherit; }
.item:hover { border-color: #bcd9c6; }
.item .av { width: 44px; height: 44px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; font-weight: 800; color: var(--brand-2); flex-shrink: 0; overflow: hidden; }
.item .av img { width: 100%; height: 100%; object-fit: cover; }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .m { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .side { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); background: var(--panel-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.filters { display: grid; grid-template-columns: 2fr repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (max-width: 640px) { .filters { grid-template-columns: 1fr 1fr; } .filters > :first-child { grid-column: 1 / -1; } }
.kv { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); font-weight: 600; }
.kv dd { margin: 0; font-weight: 600; word-break: break-word; }

/* Barres (classement CEP, style modèle) */
.bars { display: flex; flex-direction: column; gap: 5px; position: relative; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 64px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar-row .nm { font-weight: 700; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .tr { height: 14px; background: #efece3; border-radius: 3px; position: relative; overflow: hidden; }
.bar-row .fl { height: 100%; border-radius: 3px; }
.bar-row .vl { font-weight: 800; font-variant-numeric: tabular-nums; }
.fl.ok { background: var(--ok); } .fl.warn { background: #e0a526; } .fl.bad { background: var(--bad); } .fl.info { background: var(--info); }
.progress { height: 10px; background: #efece3; border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); border-radius: 99px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.reading { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; font-size: 14px; color: var(--ink-2); }
.big3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 12px; }
.big3 > div { border-left: 4px solid var(--ok); padding: 2px 12px; }
.big3 .n { font-size: 38px; font-weight: 900; line-height: 1; }
.big3 .l { font-weight: 800; font-size: 13px; } .big3 .s { font-size: 11.5px; color: var(--ink-3); }

/* Assistant de distribution */
.steps { display: flex; gap: 4px; margin-bottom: 14px; }
.steps div { flex: 1; height: 6px; border-radius: 99px; background: #e2ded2; }
.steps div.done { background: var(--ok); } .steps div.cur { background: var(--gold); }
.qty { display: grid; grid-template-columns: 1fr 70px 96px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.qty .p { text-align: center; font-weight: 800; color: var(--ink-2); }
.qty input { text-align: center; font-weight: 800; }
.qty.diff input { border-color: var(--warn); background: var(--warn-bg); }
.animal { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
.animal .hd { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 6px; }
.animal .mf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-slot { border: 2px dashed #c9c3b1; border-radius: 12px; min-height: 120px; display: grid; place-items: center; text-align: center; padding: 10px; cursor: pointer; background: #fff; color: var(--ink-2); position: relative; overflow: hidden; }
.photo-slot img { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; }
.photo-slot.filled { border-style: solid; border-color: var(--ok); }
.sigpad { width: 100%; height: 180px; background: #fff; border: 2px solid #c9c3b1; border-radius: 12px; touch-action: none; display: block; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: #fff; }
.timeline { border-left: 3px solid var(--line); margin-left: 6px; padding-left: 14px; }
.timeline .ev { position: relative; padding-bottom: 14px; }
.timeline .ev::before { content: ""; position: absolute; left: -21px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--ok); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.timeline .ev.warn::before { background: var(--warn); } .timeline .ev.bad::before { background: var(--bad); }

/* Modales et notifications */
.modal-back { position: fixed; inset: 0; background: rgba(10,20,14,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .modal-back { align-items: center; } .modal { border-radius: 18px; } }
.modal h2 { font-size: 18px; margin-bottom: 12px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.scanner video { width: 100%; border-radius: 12px; background: #000; max-height: 60vh; object-fit: cover; }
.scanner .frame { position: relative; }
.scanner .frame::after { content: ""; position: absolute; inset: 18%; border: 3px solid var(--cyan); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); }
#toast-root { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 460px); }
.toast { background: #17231b; color: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-weight: 600; font-size: 14px; }
.toast.ok { background: #13703d; } .toast.bad { background: #a22c20; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 70; display: grid; place-items: center; padding: 16px; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }

/* Écran de connexion */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 20% 10%, #1d5b3a 0, #123524 45%, #0a1f15 100%); }
.login .box { width: min(100%, 420px); background: #fff; border-radius: 18px; padding: 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.login .brand { text-align: center; margin-bottom: 16px; }
.login .brand .t { font-weight: 900; font-size: 22px; color: var(--brand); letter-spacing: .01em; }
.login .brand .t b { color: #c08b00; }
.login .logos { display: flex; justify-content: center; gap: 14px; align-items: center; margin-bottom: 10px; min-height: 10px; }
.login .logos img { max-height: 38px; max-width: 120px; }
.pin { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
.pin input { width: 100%; text-align: center; font-size: 24px; letter-spacing: .5em; font-weight: 800; }
.users-pick { display: grid; gap: 8px; max-height: 280px; overflow: auto; }
.users-pick button { text-align: left; }

/* ---------- Carte bénéficiaire (format CR80 85,6 × 54 mm) ---------- */
.kcard { width: 85.6mm; height: 54mm; border-radius: 3.2mm; background: var(--card-bg); color: #fff; position: relative; overflow: hidden; font-family: var(--font);
  -webkit-print-color-adjust: exact; print-color-adjust: exact; box-shadow: 0 6px 18px rgba(0,0,0,.25); flex-shrink: 0; }
.kcard .bgfx { position: absolute; inset: 0; background:
  radial-gradient(circle at 78% 30%, rgba(25,217,232,.16), transparent 42%),
  radial-gradient(circle at 12% 110%, rgba(59,227,138,.18), transparent 45%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3.2mm),
  repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3.2mm); }
.kcard .leaf { position: absolute; right: -6mm; top: 4mm; width: 44mm; height: 44mm; opacity: .12; }
.kcard .hdr { position: absolute; left: 4.5mm; top: 3.6mm; right: 4.5mm; display: flex; justify-content: space-between; align-items: flex-start; }
.kcard .brandline { font-weight: 900; font-size: 3.9mm; letter-spacing: .02em; display: flex; align-items: center; gap: 1.4mm; font-style: italic; }
.kcard .brandline .d { width: 1.8mm; height: 1.8mm; border-radius: 50%; background: #3be38a; box-shadow: 0 0 1.6mm #3be38a; }
.kcard .brandline b { color: var(--cyan); }
.kcard .subline { font-size: 1.55mm; letter-spacing: .32em; color: #8a979c; margin-top: .6mm; text-transform: uppercase; font-weight: 700; }
.kcard .logos { display: flex; gap: 1.2mm; background: rgba(255,255,255,.94); border-radius: 1.4mm; padding: .8mm 1.2mm; align-items: center; height: 7mm; }
.kcard .logos img { max-height: 5.2mm; max-width: 13mm; }
.kcard .logos .ph { font-size: 1.7mm; color: #123524; font-weight: 800; }
.kcard .photo { position: absolute; left: 4.5mm; top: 13.5mm; width: 19mm; height: 23.5mm; background: #000; border: .25mm solid #27333a; overflow: hidden; display: grid; place-items: center; }
.kcard .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.kcard .photo .ini { font-size: 7mm; font-weight: 900; color: #2a3a40; }
.kcard .brk { position: absolute; width: 3mm; height: 3mm; border-color: var(--cyan); border-style: solid; }
.kcard .brk.tl { left: 3.4mm; top: 12.4mm; border-width: .6mm 0 0 .6mm; }
.kcard .brk.br { left: 22.6mm; top: 35.1mm; border-width: 0 .6mm .6mm 0; }
.kcard .pbar { position: absolute; left: 4.5mm; top: 38mm; width: 19mm; height: .6mm; background: #1e2a30; }
.kcard .pbar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 60%; background: var(--cyan); }
.kcard .info { position: absolute; left: 27mm; top: 13mm; right: 4.5mm; }
.kcard .nid { font-family: var(--mono); color: var(--cyan); font-size: 2.1mm; font-weight: 700; letter-spacing: .02em; }
.kcard .nm { font-weight: 900; font-size: 4.1mm; line-height: 1.05; margin: .6mm 0 .5mm; text-transform: uppercase; letter-spacing: -.01em; max-height: 8.8mm; overflow: hidden; }
.kcard .role { font-size: 1.75mm; letter-spacing: .12em; color: #9aa7ab; text-transform: uppercase; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kcard .sep { height: .2mm; background: #26323a; margin: 1.6mm 0; }
.kcard .fl2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2mm 2mm; }
.kcard .lb { font-size: 1.45mm; letter-spacing: .22em; color: var(--cyan); font-weight: 800; text-transform: uppercase; }
.kcard .vl { font-family: var(--mono); font-size: 2.3mm; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kcard .foot { position: absolute; left: 4.5mm; right: 4.5mm; bottom: 3.2mm; display: flex; justify-content: space-between; align-items: flex-end; }
.kcard .foot .fx { display: flex; gap: 5mm; }
.kcard .stamp { text-align: right; font-size: 1.9mm; color: var(--cyan); font-weight: 900; letter-spacing: .04em; }
.kcard .stamp small { display: block; font-size: 1.3mm; color: #52606a; letter-spacing: .12em; font-weight: 700; }
.kcard .glow { position: absolute; left: 0; right: 0; top: 36.6mm; height: .5mm; background: linear-gradient(90deg, transparent, rgba(25,217,232,.55), transparent); }
.kcard .bottomglow { position: absolute; left: 0; right: 0; bottom: 0; height: .9mm; background: var(--cyan); opacity: .8; }
/* verso */
.kcard.verso .sigl { position: absolute; left: 4.5mm; top: 5mm; font-size: 1.5mm; letter-spacing: .26em; color: var(--cyan); font-weight: 800; text-transform: uppercase; }
.kcard.verso .sig { position: absolute; left: 4.5mm; top: 8mm; width: 50mm; height: 9.5mm; background: #e6e6e6; border-left: 1.2mm solid var(--cyan); border-radius: .6mm; }
.kcard.verso .note { position: absolute; left: 4.5mm; top: 20.5mm; width: 50mm; border: .2mm solid #2a3339; background: #111519; border-radius: .8mm; padding: 1.5mm 2mm; font-size: 1.6mm; color: #9aa4a8; line-height: 1.35; }
.kcard.verso .note b { color: #d8e1e3; }
.kcard.verso .qr { position: absolute; right: 4.5mm; top: 5mm; width: 21mm; height: 21mm; background: #fff; border-radius: 1.4mm; padding: 1mm; }
.kcard.verso .qr svg { width: 100%; height: 100%; display: block; }
.kcard.verso .qrl { position: absolute; right: 4.5mm; top: 27mm; width: 21mm; text-align: center; font-family: var(--mono); font-size: 1.55mm; color: #9aa4a8; font-weight: 700; }
.kcard.verso .mrz { position: absolute; left: 4.5mm; bottom: 4.5mm; right: 26mm; font-family: var(--mono); font-size: 2mm; letter-spacing: .28em; color: #3b464d; word-break: break-all; line-height: 1.3; }
.kcard.verso .line { position: absolute; left: 4.5mm; right: 4.5mm; top: 38.5mm; height: .2mm; background: #232c32; }
.kcard.verso .vb { position: absolute; right: 4.5mm; bottom: 4mm; text-align: right; font-weight: 900; font-style: italic; font-size: 2.6mm; }
.kcard.verso .vb b { color: var(--cyan); }
.kcard.verso .vb small { display: block; font-style: normal; font-size: 1.3mm; color: #6b777d; letter-spacing: .08em; font-weight: 700; }
.card-preview { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 8px 0; }
.card-preview .kcard { transform-origin: top left; }
@media (max-width: 420px) { .card-preview .kcard { zoom: .95; } }

/* ---------- Impression ---------- */
#print-root { display: none; }
@media print {
  body.printing > *:not(#print-root) { display: none !important; }
  body.printing #print-root { display: block; }
  body.printing { background: #fff; }
  .print-card-page { width: 85.6mm; height: 54mm; page-break-after: always; break-after: page; overflow: hidden; }
  .print-card-page .kcard { box-shadow: none; border-radius: 0; }
  .a4 { page-break-after: always; break-after: page; }
  .no-print { display: none !important; }
}
.a4 { font-size: 11.5px; color: #111; background: #fff; }
.a4 .ph { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2.5px solid #123524; padding-bottom: 8px; margin-bottom: 10px; gap: 12px; }
.a4 .ph h1 { font-size: 19px; color: #123524; }
.a4 .ph .k { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: #9a6c00; font-weight: 800; }
.a4 .ph .logos img { max-height: 34px; margin-left: 8px; }
.a4 h2 { font-size: 13px; color: #123524; margin: 12px 0 6px; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
.a4 table { width: 100%; border-collapse: collapse; }
.a4 th, .a4 td { border: 1px solid #cfcfcf; padding: 3px 5px; text-align: left; vertical-align: top; font-size: 10.5px; }
.a4 th { background: #eef3ef; }
.a4 .kv { font-size: 11.5px; grid-template-columns: 34% 1fr; gap: 2px 10px; }
.a4 .ev img { max-width: 150px; max-height: 120px; border: 1px solid #ccc; margin: 2px 6px 2px 0; }
.a4 .sigs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.a4 .sigs div { border-top: 1px solid #333; padding-top: 4px; font-size: 10.5px; min-height: 50px; }
.a4 .foot { margin-top: 12px; font-size: 9.5px; color: #666; }
</style>
</head>

        return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
      }).join('')}</row>`).join('');
      const ncol = Math.max(1, ...s.rows.map((r) => r.length));
      const cols = `<cols>${Array.from({ length: ncol }, (_, i) => `<col min="${i + 1}" max="${i + 1}" width="${(s.widths && s.widths[i]) || 18}" customWidth="1"/>`).join('')}</cols>`;
      files.push({ name: `xl/worksheets/sheet${si + 1}.xml`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData><autoFilter ref="A1:${colName(ncol - 1)}${Math.max(1, s.rows.length)}"/></worksheet>` });
    });
    return zip(files);
  }

  async function inflate(data) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function unzip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('Fichier Excel invalide');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = {};
    const dec = new TextDecoder();
    for (let i = 0; i < count; i++) {
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      const raw = u8.subarray(start, start + csize);
      out[name] = { method, raw };
      p += 46 + nlen + elen + clen;
    }
    return {
      names: Object.keys(out),
      async text(name) {
        const f = out[name];
        if (!f) return null;
        return dec.decode(f.method === 0 ? f.raw : await inflate(f.raw));
      },
    };
  }
  const colIndex = (ref) => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };

  /* Retourne [{name, rows:[[...]]}] */
  async function read(buf) {
    const z = await unzip(buf);
    const parse = (s) => new DOMParser().parseFromString(s, 'application/xml');
    const shared = [];
    const ss = await z.text('xl/sharedStrings.xml');
    if (ss) parse(ss).querySelectorAll('si').forEach((si) => shared.push(Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join('')));
    const wb = parse(await z.text('xl/workbook.xml'));
    const rels = parse(await z.text('xl/_rels/workbook.xml.rels'));
    const relMap = {};
    rels.querySelectorAll('Relationship').forEach((r) => (relMap[r.getAttribute('Id')] = r.getAttribute('Target')));
    const sheets = [];
    for (const sh of Array.from(wb.getElementsByTagName('sheet'))) {
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = relMap[rid] || '';
      target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
      const xml = await z.text(target);
      if (!xml) continue;
      const doc = parse(xml);
      const rows = [];
      doc.querySelectorAll('sheetData > row').forEach((row) => {
        const r = [];
        row.querySelectorAll('c').forEach((c) => {
          const t = c.getAttribute('t');
          const v = c.getElementsByTagName('v')[0];
          let val = null;
          if (t === 's') val = shared[+v.textContent];
          else if (t === 'inlineStr') val = Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('');
          else if (v) val = t === 'str' || t === 'b' ? v.textContent : (isNaN(+v.textContent) ? v.textContent : +v.textContent);
          r[colIndex(c.getAttribute('r'))] = val;
        });
        rows[+row.getAttribute('r') - 1] = r;
      });
      sheets.push({ name: sh.getAttribute('name'), rows: Array.from(rows, (r) => r || []) });
    }
    return sheets;
  }

  return { write, read, zip, crc32 };
})();

/* Couche données : IndexedDB, sécurité (PIN, chiffrement), synchronisation par fichier, calculs. */
const U = {
  $: (s, el = document) => el.querySelector(s),
  $$: (s, el = document) => Array.from(el.querySelectorAll(s)),
  esc: (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  now: () => Date.now(),
  uid: (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  rand: (n) => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(n)); r.forEach((x) => (s += a[x % a.length])); return s; },
  fmtDate: (ts, time = true) => { if (!ts) return ''; const d = new Date(ts); const p = (n) => String(n).padStart(2, '0'); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}` + (time ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : ''); },
  pct: (a, b) => (b ? Math.round((a / b) * 100) : 0),
  norm: (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(),
  initials: (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase(),
  download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  },
  stamp: () => { const d = new Date(); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; },
  slug: (s) => U.norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40),
};

/* SHA-256 en JavaScript pur (fonctionne même hors contexte sécurisé). */
function sha256(str) {
  const bytes = new TextEncoder().encode(str);
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const l = bytes.length, withPad = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(withPad); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(withPad - 4, l * 8); dv.setUint32(withPad - 8, Math.floor((l * 8) / 2 ** 32));
  const w = new Uint32Array(64);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < withPad; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => (H[i] = (H[i] + v) >>> 0));
  }
  return H.map((x) => x.toString(16).padStart(8, '0')).join('');
}
function hashPin(pin, salt) { let h = salt + ':' + pin; for (let i = 0; i < 2000; i++) h = sha256(h + salt); return h; }

const Crypto = {
  available: () => !!(window.crypto && crypto.subtle),
  b64: (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  unb64: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)),
  async key(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(text, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const k = await Crypto.key(pass, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(text)));
    return JSON.stringify({ kyf: 1, enc: 'AES-GCM', salt: Crypto.b64(salt), iv: Crypto.b64(iv), data: Crypto.b64(ct) });
  },
  async decrypt(obj, pass) {
    const k = await Crypto.key(pass, Crypto.unb64(obj.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: Crypto.unb64(obj.iv) }, k, Crypto.unb64(obj.data));
    return new TextDecoder().decode(pt);
  },
};

const DB = {
  db: null,
  STORES: ['kv', 'households', 'ceps', 'distributions', 'media', 'users', 'audit'],
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('kyf-suivi', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        DB.STORES.forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' }); });
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode);
      const os = t.objectStore(store);
      let out;
      Promise.resolve(fn(os)).then((v) => (out = v));
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Transaction annulée'));
    });
  },
  all(store) { return new Promise((res, rej) => { const q = DB.db.transaction(store).objectStore(store).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  get(store, id) { return new Promise((res, rej) => { const q = DB.db.transaction(store).objectStore(store).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  put(store, obj) { return DB.tx(store, 'readwrite', (os) => { os.put(obj); }); },
  putMany(store, arr) { return DB.tx(store, 'readwrite', (os) => { arr.forEach((o) => os.put(o)); }); },
  del(store, id) { return DB.tx(store, 'readwrite', (os) => { os.delete(id); }); },
  clearAll() { return Promise.all(DB.STORES.map((s) => DB.tx(s, 'readwrite', (os) => { os.clear(); }))); },
  async kv(k, v) {
    if (v === undefined) { const r = await DB.get('kv', k); return r ? r.v : undefined; }
    return DB.put('kv', { k, v });
  },
};

const Store = {
  async init() {
    await DB.open();
    S.device = await DB.kv('device');
    if (!S.device) { S.device = 'APP-' + U.rand(6); await DB.kv('device', S.device); }
    S.lang = (await DB.kv('lang')) || 'fr';
    S.settings = (await DB.kv('settings')) || null;
    if (!S.settings) { S.settings = DEFAULT_SETTINGS(); await DB.kv('settings', S.settings); }
    const [users, ceps, hh, dist] = await Promise.all(['users', 'ceps', 'households', 'distributions'].map((s) => DB.all(s)));
    users.forEach((u) => S.users.set(u.id, u));
    ceps.forEach((c) => S.ceps.set(c.id, c));
    hh.forEach((h) => S.hh.set(h.id, h));
    dist.forEach((d) => S.dist.set(d.id, d));
    await Store.applySeed();
    await Store.migrateKits();
    await Store.fillKitDefaults();
    S.reindex();
  },
  /* Complète les quantités / cibles encore vides avec les valeurs du projet, sans écraser une saisie. */
  async fillKitDefaults() {
    const v = S.settings.kitsVersion || 0;
    if (v >= 3) return;
    if (v === 2) {
      // Version 2 -> 3 : nouvelles valeurs du tableau de répartition, seulement là où l'ancienne valeur n'a pas été modifiée.
      const prev = { mais: [10, null], soja: [9, 200], haricot: [10, null] }, def = DEFAULT_KITS();
      Object.entries(prev).forEach(([code, [q, c]]) => {
        const k = S.settings.kits[code]; if (!k) return;
        const it = k.items.find((i) => i.code === code);
        if (it && it.qte === q) it.qte = def[code].items[0].qte;
        if (k.cible === c) k.cible = def[code].cible;
      });
      S.settings.kitsVersion = 3; S.settings._u = U.now();
      await DB.kv('settings', S.settings);
      return;
    }
    const def = DEFAULT_KITS();
    for (const [code, dk] of Object.entries(def)) {
      const k = S.settings.kits[code];
      if (!k) { S.settings.kits[code] = dk; continue; }
      if (k.cible == null) k.cible = dk.cible;
      if (code === 'maraicher' && k.items.every((i) => i.qte == null)) { k.items = dk.items; continue; }
      k.items.forEach((i) => { const d = dk.items.find((x) => x.code === i.code); if (d && i.qte == null) { i.qte = d.qte; i.unite = d.unite; } });
    }
    S.settings.kitsVersion = 3; S.settings._u = U.now();
    await DB.kv('settings', S.settings);
  },
  /* Ancien modèle (kit vivrier générique) -> un kit par culture du CEP. */
  async migrateKits() {
    const k = S.settings.kits || {};
    if (!k.vivrier || k.mais) return;
    const nk = DEFAULT_KITS();
    if (k.maraicher) nk.maraicher.items = k.maraicher.items.concat(nk.maraicher.items.filter((i) => !k.maraicher.items.some((x) => U.norm(x.nom) === U.norm(i.nom))));
    (k.vivrier.items || []).forEach((i) => { const code = { mais: 'mais', haricot: 'haricot', soja: 'soja', riz: 'riz', pdt: 'pdt' }[i.code]; if (code && i.qte != null) nk[code].items[0].qte = i.qte; });
    S.settings.kits = nk; S.settings._u = U.now();
    await DB.kv('settings', S.settings);
    const seedKit = new Map(((window.KYF_SEED || {}).ceps || []).map((c) => [c.id, c.kit]));
    for (const c of S.ceps.values()) {
      if (c.kit === 'vivrier') { c.kit = seedKit.get(c.id) && nk[seedKit.get(c.id)] ? seedKit.get(c.id) : ''; await Store.saveCep(c); }
    }
  },
  /* Ajoute les ménages du registre intégré au fichier sans jamais écraser les données saisies. */
  async applySeed() {
    const seed = window.KYF_SEED;
    if (!seed || !seed.households || !seed.households.length) return;
    const done = await DB.kv('seedVersion');
    if (done && done >= seed.seedVersion) return;
    const newCeps = [], newHh = [];
    for (const c of seed.ceps) {
      const ex = S.ceps.get(c.id);
      if (!ex) { const rec = { ...c, kitSeed: c.kit, _u: 1, _src: 'registre' }; S.ceps.set(c.id, rec); newCeps.push(rec); }
      else {
        // Les informations descriptives d'un CEP du registre suivent les listes (le kit reste celui choisi sur l'appareil).
        let changed = false;
        // Le kit suit le registre tant qu'il n'a pas été changé sur l'appareil (kitSeed = dernier kit reçu du registre).
        const fromSeed = ex.kitSeed === undefined ? ex._src === 'registre' : ex.kit === ex.kitSeed;
        if (c.kit && ex.kit !== c.kit && (!ex.kit || fromSeed)) { ex.kit = c.kit; changed = true; }
        if (c.kit && ex.kitSeed !== c.kit) { ex.kitSeed = c.kit; changed = true; }
        if (ex._src === 'registre') ['nom', 'village', 'facilitateur', 'jour', 'speculation'].forEach((k) => { if (c[k] && ex[k] !== c[k]) { ex[k] = c[k]; changed = true; } });
        if (changed) { ex._u = U.now(); newCeps.push(ex); }
      }
    }
    for (const h of seed.households) {
      const ex = S.hh.get(h.id);
      if (!ex) { const rec = { ...h, profil: {}, _u: 1, _src: 'registre' }; S.hh.set(h.id, rec); newHh.push(rec); }
      else if (ex._src === 'registre' && ex._u === 1) {
        // Fiche jamais modifiée sur l'appareil : elle suit les corrections apportées aux listes.
        const rec = { ...ex, ...h, profil: ex.profil || {}, _u: 1, _src: 'registre' };
        if (JSON.stringify(rec) !== JSON.stringify(ex)) { S.hh.set(h.id, rec); newHh.push(rec); }
      }
    }
    if (newCeps.length) await DB.putMany('ceps', newCeps);
    if (newHh.length) await DB.putMany('households', newHh);
    await DB.kv('seedVersion', seed.seedVersion);
  },
  stampRec(o) { o._u = U.now(); o._by = S.user ? S.user.id : null; o._dev = S.device; return o; },
  async audit(action, ref, info = '') {
    const a = { id: U.uid('A'), ts: U.now(), user: S.user ? S.user.id : null, userNom: S.user ? S.user.nom : '', dev: S.device, action, ref, info: String(info).slice(0, 400), _u: U.now() };
    await DB.put('audit', a);
  },
  async saveSettings(s) { s._u = U.now(); S.settings = s; await DB.kv('settings', s); await Store.audit('parametres', 'settings'); },
  async saveUser(u) { Store.stampRec(u); S.users.set(u.id, u); await DB.put('users', u); },
  async saveCep(c) { Store.stampRec(c); S.ceps.set(c.id, c); await DB.put('ceps', c); },
  async saveHh(h, action = 'menage-modifie') { Store.stampRec(h); S.hh.set(h.id, h); await DB.put('households', h); await Store.audit(action, h.id); },
  async saveDist(d, action = 'distribution') { Store.stampRec(d); S.dist.set(d.id, d); await DB.put('distributions', d); S.reindex(); await Store.audit(action, d.id, `${d.hhId} ${d.type} ${d.statut}`); },
  async putMedia(dataUrl, kind) { const id = U.uid('M'); await DB.put('media', { id, data: dataUrl, kind, ts: U.now(), _u: U.now(), _dev: S.device }); return id; },
  async media(id) { if (!id) return null; const m = await DB.get('media', id); return m ? m.data : null; },

  newHouseholdId(cepId) {
    const c = S.ceps.get(cepId);
    const terr = cepId.slice(0, 2), num = cepId.slice(2);
    let id;
    do { id = `KYF-${terr}-${num}-N${U.rand(3)}`; } while (S.hh.has(id));
    return c ? id : `KYF-XX-00-N${U.rand(4)}`;
  },

  /* ---------- Plan de distribution & statuts ---------- */
  kitFor(h) {
    const c = S.ceps.get(h.cep);
    const code = h.kit || (c && c.kit) || '';
    return code && S.settings.kits[code] ? { code, ...S.settings.kits[code] } : null;
  },
  activeDist(hhId, type) {
    const arr = (S.distByHh.get(hhId) || []).filter((d) => d.type === type && d.statut !== 'rejetee');
    return arr[arr.length - 1] || null;
  },
  statusOf(h) {
    const s = Store.activeDist(h.id, 'semences'), b = Store.activeDist(h.id, 'betail');
    const n = (s ? 1 : 0) + (b ? 1 : 0);
    const valid = s && b && s.statut === 'validee' && b.statut === 'validee';
    return { sem: s, bet: b, code: valid ? 'valide' : n === 2 ? 'servi' : n === 1 ? 'partiel' : 'non_servi' };
  },
  anomalies(d) {
    const a = [];
    if (d.ecart) a.push('Écart de quantité');
    if (d.type === 'semences' && (d.items || []).some((i) => i.prevu == null)) a.push('Quantité prévue non définie');
    if (d.receveur && d.receveur.type === 'mandataire') a.push('Mandataire');
    if (!d.preuves || !d.preuves.qr) a.push('Identification manuelle');
    if (!d.preuves || !d.preuves.gps) a.push('Sans GPS');
    if (d.animaux && d.animaux.some((x) => x.sante === 'malade')) a.push('Animal malade');
    const others = (S.distByHh.get(d.hhId) || []).filter((o) => o.id !== d.id && o.type === d.type && o.statut !== 'rejetee');
    if (others.length && d.statut !== 'rejetee') a.push('Doublon possible');
    return a;
  },
  vulnScore(p) {
    const v = (p && p.vuln) || {};
    return ['femmeCheffe', 'handicap', 'deplace', 'agee', 'maladie', 'veuf', 'enfantsSeuls'].filter((k) => v[k]).length;
  },
  ageGroup(h) {
    const a = +h.age;
    if (a) return a < 35 ? '18-34' : a < 60 ? '35-59' : '60+';
    if (/<\s*35/.test(h.ageTranche || '')) return '18-34';
    return 'Inconnu';
  },

  /* ---------- Synchronisation par fichier ---------- */
  async buildExport({ since = 0, photos = true, scope = 'all' } = {}) {
    const f = (arr) => arr.filter((r) => (r._u || 0) > since);
    const [users, ceps, hh, dist, audit] = await Promise.all(['users', 'ceps', 'households', 'distributions', 'audit'].map((s) => DB.all(s)));
    const pack = {
      kyf: 1, type: 'kyf-export', device: S.device, user: S.user ? S.user.nom : '', createdAt: U.now(), since,
      settings: S.settings, users: f(users), ceps: f(ceps), households: scope === 'dist' ? [] : f(hh), distributions: f(dist), audit: f(audit), media: [],
    };
    if (photos) {
      const ids = new Set();
      pack.distributions.forEach((d) => { const p = d.preuves || {}; [p.photo, p.signature, p.empreinte, d.receveur && d.receveur.photo].forEach((x) => x && ids.add(x)); });
      pack.households.forEach((h) => h.photo && ids.add(h.photo));
      for (const id of ids) { const m = await DB.get('media', id); if (m) pack.media.push(m); }
    }
    return pack;
  },
  async importPack(pack) {
    if (!pack || pack.kyf !== 1 || pack.type !== 'kyf-export') throw new Error('Fichier non reconnu');
    const stats = { menages: 0, distributions: 0, photos: 0, utilisateurs: 0, cep: 0 };
    const merge = async (store, arr, map, key) => {
      const out = [];
      for (const r of arr || []) {
        const loc = map ? map.get(r.id) : await DB.get(store, r.id);
        if (!loc || (r._u || 0) > (loc._u || 0)) { out.push(r); if (map) map.set(r.id, r); }
      }
      if (out.length) await DB.putMany(store, out);
      if (key) stats[key] += out.length;
    };
    await merge('users', pack.users, S.users, 'utilisateurs');
    await merge('ceps', pack.ceps, S.ceps, 'cep');
    await merge('households', pack.households, S.hh, 'menages');
    await merge('distributions', pack.distributions, S.dist, 'distributions');
    await merge('media', pack.media, null, 'photos');
    await merge('audit', pack.audit, null, null);
    if (pack.settings && (pack.settings._u || 0) > (S.settings._u || 0)) { S.settings = pack.settings; await DB.kv('settings', S.settings); }
    S.reindex();
    const log = (await DB.kv('syncLog')) || [];
    log.unshift({ ts: U.now(), sens: 'import', de: `${pack.user || ''} (${pack.device})`, stats });
    await DB.kv('syncLog', log.slice(0, 50));
    await Store.audit('import', pack.device, JSON.stringify(stats));
    return stats;
  },
  async pendingCount() {
    const since = (await DB.kv('lastExport')) || 0;
    let n = 0;
    for (const d of S.dist.values()) if ((d._u || 0) > since && d._dev === S.device) n++;
    for (const h of S.hh.values()) if ((h._u || 0) > since && h._dev === S.device) n++;
    return n;
  },
};

  sw: {},
};
function t(s, vars) {
  let r = (S.lang === 'sw' && I18N.sw[s]) || I18N.fr[s] || s;
  if (vars) r = r.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? ''));
  return r;
}

/* Écrans de l'application. */
const Q = () => new URLSearchParams((location.hash.split('?')[1]) || '');
const CULTURES = ['Maïs', 'Haricot', 'Soja', 'Riz', 'Pomme de terre', 'Manioc', 'Banane', 'Tomate', 'Chou', 'Oignon', 'Aubergine', 'Poireau', 'Poivron', 'Amarante', 'Carotte', 'Autre'];
const ELEVAGE = ['Poules', 'Lapins', 'Cobayes', 'Chèvres', 'Porcs', 'Aucun'];
const VULN = [['femmeCheffe', 'Femme cheffe de ménage'], ['handicap', 'Personne vivant avec handicap'], ['deplace', 'Ménage déplacé / retourné'], ['agee', 'Personne âgée (60+) sans soutien'], ['maladie', 'Maladie chronique dans le ménage'], ['veuf', 'Veuf / veuve'], ['enfantsSeuls', 'Orphelins ou enfants seuls à charge']];
const MOTIFS_ECART = ['Rupture de stock', 'Animal malade ou mort avant remise', 'Refus partiel du bénéficiaire', 'Erreur de planification', 'Autre'];
const MOTIFS_IDENT = ['Carte pas encore imprimée', 'Carte oubliée', 'Carte perdue', 'QR code illisible', 'Téléphone sans lecteur QR'];
const LIENS = ['Conjoint(e)', 'Enfant', 'Parent', 'Frère / sœur', 'Autre membre du ménage', 'Voisin / autre'];
const SANTE = [['bon', 'Bon'], ['moyen', 'Moyen'], ['malade', 'Malade']];

const Views = {
  W: null,
  F: { q: '', terr: '', cep: '', st: '', ver: '', limit: 60 },

  cepsOf(terr) { return [...S.ceps.values()].filter((c) => !terr || c.territoire === terr).sort((a, b) => a.id.localeCompare(b.id)); },
  terrs() { return Object.keys(S.settings.cibles); },

  /* ======================= TABLEAU DE BORD ======================= */
  compute(terr) {
    const hhs = [...S.hh.values()].filter((h) => !terr || h.territoire === terr);
    const cible = terr ? +S.settings.cibles[terr] || 0 : Object.values(S.settings.cibles).reduce((a, b) => a + +b, 0);
    const st = { cible, total: hhs.length, profil: 0, sem: 0, bet: 0, complet: 0, valide: 0, aucun: 0, verifier: 0 };
    const dists = [];
    const byCep = new Map();
    const dis = { sexe: {}, age: {}, vuln: {} };
    const addDis = (grp, key, served) => { const g = dis[grp]; g[key] = g[key] || { n: 0, s: 0 }; g[key].n++; if (served) g[key].s++; };
    for (const h of hhs) {
      const s = Store.statusOf(h);
      if (h.profil && h.profil.completedAt) st.profil++;
      if (h.verifier && h.verifier.length) st.verifier++;
      if (s.sem) { st.sem++; dists.push(s.sem); }
      if (s.bet) { st.bet++; dists.push(s.bet); }
      if (s.code === 'servi' || s.code === 'valide') st.complet++;
      if (s.code === 'valide') st.valide++;
      if (s.code === 'non_servi') st.aucun++;
      const c = byCep.get(h.cep) || { n: 0, complet: 0, partiel: 0 };
      c.n++; if (s.code === 'servi' || s.code === 'valide') c.complet++; else if (s.code === 'partiel') c.partiel++;
      byCep.set(h.cep, c);
      const served = s.code !== 'non_servi';
      addDis('sexe', h.sexe === 'F' ? 'Femmes' : h.sexe === 'M' ? 'Hommes' : 'Non précisé', served);
      addDis('age', Store.ageGroup(h), served);
      const v = (h.profil && h.profil.vuln) || {};
      VULN.forEach(([k, l]) => { if (v[k]) addDis('vuln', l, served); });
      if (Store.vulnScore(h.profil) === 0 && h.profil && h.profil.completedAt) addDis('vuln', 'Aucune vulnérabilité déclarée', served);
    }
    // Animaux & semences
    const anim = S.settings.animaux.map((a) => ({ ...a, pm: a.m * st.total, pf: a.f * st.total, rm: 0, rf: 0, sante: { bon: 0, moyen: 0, malade: 0 } }));
    const items = new Map();
    for (const h of hhs) {
      const k = Store.kitFor(h);
      if (k) k.items.forEach((it) => { const r = items.get(it.nom) || { nom: it.nom, unite: it.unite, prevu: 0, remis: 0, sansQte: 0 }; if (it.qte) r.prevu += +it.qte; else r.sansQte++; items.set(it.nom, r); });
    }
    const kits = Object.entries(S.settings.kits).map(([code, k]) => ({ code, nom: k.nom, cible: k.cible, items: k.items, affectes: 0, remis: 0, valides: 0 }));
    let sansKit = 0;
    for (const h of hhs) {
      const k = Store.kitFor(h);
      if (!k) { sansKit++; continue; }
      const r = kits.find((x) => x.code === k.code);
      r.affectes++;
      const d = Store.activeDist(h.id, 'semences');
      if (d) { r.remis++; if (d.statut === 'validee') r.valides++; }
    }
    const q = { n: dists.length, photo: 0, sig: 0, gps: 0, qr: 0, mand: 0, ecart: 0, attente: 0, doublon: 0 };
    const pts = [];
    for (const d of dists) {
      const p = d.preuves || {};
      if (p.photo) q.photo++; if (p.signature || p.empreinte) q.sig++; if (p.gps) { q.gps++; pts.push({ ...p.gps, terr: (S.hh.get(d.hhId) || {}).territoire, type: d.type }); }
      if (p.qr) q.qr++; if (d.receveur && d.receveur.type === 'mandataire') q.mand++; if (d.ecart) q.ecart++; if (d.statut === 'en_attente') q.attente++;
      if (Store.anomalies(d).includes('Doublon possible')) q.doublon++;
      if (d.type === 'betail') (d.animaux || []).forEach((x) => { const a = anim.find((y) => y.code === x.code); if (a) { a.rm += +x.m || 0; a.rf += +x.f || 0; if (a.sante[x.sante] !== undefined) a.sante[x.sante]++; } });
      if (d.type === 'semences') (d.items || []).forEach((x) => { const r = items.get(x.nom) || { nom: x.nom, unite: x.unite, prevu: 0, remis: 0, sansQte: 0 }; r.remis += +x.remis || 0; items.set(x.nom, r); });
    }
    const rejets = [...S.dist.values()].filter((d) => d.statut === 'rejetee' && (!terr || (S.hh.get(d.hhId) || {}).territoire === terr)).length;
    return { st, byCep, dis, anim, items: [...items.values()], q, pts, rejets, kits, sansKit };
  },
  async dashboard() {
    const terr = Q().get('t') || '';
    const R = Views.compute(terr);
    const { st, q } = R;
    const cls = (p) => (p >= 80 ? 'ok' : p >= 40 ? 'warn' : 'bad');
    const ceps = Views.cepsOf(terr).map((c) => { const v = R.byCep.get(c.id) || { n: 0, complet: 0, partiel: 0 }; return { c, ...v, p: U.pct(v.complet, v.n) }; })
      .filter((x) => x.n).sort((a, b) => b.p - a.p || b.partiel - a.partiel || a.c.nom.localeCompare(b.c.nom));
    const nOk = ceps.filter((x) => x.p >= 80).length, nMid = ceps.filter((x) => x.p >= 40 && x.p < 80).length, nLow = ceps.length - nOk - nMid;
    const terrCards = Views.terrs().map((tn) => {
      const r = tn === terr || !terr ? Views.compute(tn).st : null;
      if (!r) return '';
      return `<div class="card"><div class="row between"><h2>${U.esc(tn)}</h2><span class="badge">${t('Cible')} ${r.cible}</span></div>
        <div class="small muted">${t('Ménages enregistrés')} : <b>${r.total}</b> / ${r.cible} (${U.pct(r.total, r.cible)} %)</div><div class="progress" style="margin:4px 0 10px"><div style="width:${Math.min(100, U.pct(r.total, r.cible))}%;background:var(--info)"></div></div>
        <div class="small muted">${t('Complètement servis')} : <b>${r.complet}</b> / ${r.cible} (${U.pct(r.complet, r.cible)} %)</div><div class="progress" style="margin-top:4px"><div style="width:${Math.min(100, U.pct(r.complet, r.cible))}%"></div></div></div>`;
    }).join('');
    const disTable = (grp, title) => {
      const rows = Object.entries(R.dis[grp]).sort((a, b) => b[1].n - a[1].n);
      if (!rows.length) return `<h3>${t(title)}</h3><p class="muted small">${t('Pas encore de données de profilage.')}</p>`;
      return `<h3>${t(title)}</h3><table class="tbl"><thead><tr><th></th><th class="num">${t('Ménages')}</th><th class="num">${t('Servis')}</th><th class="num">%</th></tr></thead><tbody>${rows.map(([k, v]) => `<tr><td>${U.esc(t(k))}</td><td class="num">${v.n}</td><td class="num">${v.s}</td><td class="num"><b>${U.pct(v.s, v.n)}</b></td></tr>`).join('')}</tbody></table>`;
    };
    const qrow = (label, n, good = true) => { const p = U.pct(n, q.n); return `<div class="bar-row"><div class="nm">${t(label)}</div><div class="tr"><div class="fl ${good ? cls(p) : p > 20 ? 'bad' : p > 5 ? 'warn' : 'ok'}" style="width:${p}%"></div></div><div class="vl">${n} <span class="muted small">(${p}%)</span></div></div>`; };
    const topCep = ceps.filter((x) => x.p >= 80).slice(0, 3).map((x) => `<b>${U.esc(x.c.nom)}</b> (${x.p} %)`).join(', ');
    const lowCep = ceps.filter((x) => x.p < 40).slice(-4).map((x) => `<b>${U.esc(x.c.nom)}</b>`).join(', ');
    const reading = st.sem + st.bet === 0
      ? t("Aucune distribution n'a encore été enregistrée. Le registre compte {n} ménages répartis dans {c} CEP ; {v} fiches contiennent des informations à vérifier (écriture manuscrite incertaine).", { n: st.total, c: ceps.length, v: st.verifier })
      : t('{a} ménages ont reçu leur kit de semences et {b} leur petit bétail ; {c} ménages sont complètement servis ({p} % de la cible).', { a: st.sem, b: st.bet, c: st.complet, p: U.pct(st.complet, st.cible) })
        + (topCep ? ' ' + t('Les CEP les plus avancés sont {x}.', { x: topCep }) : '')
        + (lowCep ? ' ' + t('Une attention particulière est nécessaire pour {x}.', { x: lowCep }) : '')
        + (q.attente ? ' ' + t('{n} remises attendent la validation du superviseur.', { n: q.attente }) : '')
        + (q.ecart ? ' ' + t('{n} remises présentent un écart de quantité justifié.', { n: q.ecart }) : '');
    await shell(`
      <div class="page-head"><div><div class="kicker">${U.esc(S.settings.projet)} · ${t('Suivi des distributions')}</div><h1>${t('Tableau de bord')}</h1>
        <div class="sub">${t('Cible')} : <b style="color:var(--bad)">${st.cible} ${t('ménages')}</b> · ${t('1 kit de semences + 3 poules, 3 lapins, 3 cobayes par ménage')}</div></div>
        <div class="big"><div class="n">${st.complet}</div><div class="l">${t('Ménages servis')}</div><div class="small muted">${U.pct(st.complet, st.cible)} % ${t('de la cible')}</div></div></div>
      <div class="row" style="margin-bottom:12px"><div class="seg" style="min-width:280px">${[['', 'Tous'], ...Views.terrs().map((x) => [x, x])].map(([v, l]) => `<label><input type="radio" name="terr" value="${v}" ${v === terr ? 'checked' : ''}>${t(l)}</label>`).join('')}</div></div>
      <div class="kpis">
        <div class="kpi info"><div class="n">${st.total}</div><div class="l">${t('Ménages enregistrés')}</div><div class="s">${U.pct(st.total, st.cible)} % ${t('de la cible')}</div></div>
        <div class="kpi ${cls(U.pct(st.profil, st.total))}"><div class="n">${st.profil}</div><div class="l">${t('Ménages profilés')}</div><div class="s">${U.pct(st.profil, st.total)} % ${t('des enregistrés')}</div></div>
        <div class="kpi ${cls(U.pct(st.sem, st.total))}"><div class="n">${st.sem}</div><div class="l">${t('Kits de semences remis')}</div><div class="s">${U.pct(st.sem, st.total)} %</div></div>
        <div class="kpi ${cls(U.pct(st.bet, st.total))}"><div class="n">${st.bet}</div><div class="l">${t('Lots de petit bétail remis')}</div><div class="s">${U.pct(st.bet, st.total)} %</div></div>
        <div class="kpi ${q.attente ? 'warn' : 'ok'}"><div class="n">${q.attente}</div><div class="l">${t('En attente de validation')}</div><div class="s">${st.valide} ${t('ménages validés')}</div></div>
        <div class="kpi ${st.aucun ? 'bad' : 'ok'}"><div class="n">${st.aucun}</div><div class="l">${t('Ménages non servis')}</div><div class="s">${R.rejets} ${t('remises rejetées')}</div></div>
      </div>
      <div class="grid g2" style="margin-bottom:14px">${terrCards}</div>
      <div class="grid g2">
        <div class="card"><div class="row between"><h2>${t('Classement des CEP')}</h2><span class="muted small">% ${t('ménages complètement servis')}</span></div>

  gpsMap(pts) {
    if (!pts.length) return `<p class="muted">${t('Aucune remise géolocalisée pour le moment.')}</p>`;
    const la = pts.map((p) => p.lat), lo = pts.map((p) => p.lon);
    let [a0, a1, o0, o1] = [Math.min(...la), Math.max(...la), Math.min(...lo), Math.max(...lo)];
    const pad = Math.max(0.01, (a1 - a0) * 0.1, (o1 - o0) * 0.1); a0 -= pad; a1 += pad; o0 -= pad; o1 += pad;
    const W = 800, H = 360;
    const col = { Beni: '#1f9a55', Lubero: '#1f6fb2' };
    const dots = pts.map((p) => `<circle cx="${((p.lon - o0) / (o1 - o0)) * W}" cy="${H - ((p.lat - a0) / (a1 - a0)) * H}" r="5" fill="${col[p.terr] || '#d99a0b'}" fill-opacity=".75" stroke="#fff" stroke-width="1"><title>${p.lat}, ${p.lon} (${p.type})</title></circle>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#f1efe7;border-radius:10px;border:1px solid var(--line)">
      ${[0.25, 0.5, 0.75].map((f) => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="#e0dccf"/><line y1="0" y2="${H}" x1="${W * f}" x2="${W * f}" stroke="#e0dccf"/>`).join('')}${dots}
      <text x="8" y="16" font-size="12" fill="#7c887f">${a1.toFixed(3)}°</text><text x="8" y="${H - 6}" font-size="12" fill="#7c887f">${a0.toFixed(3)}° · ${o0.toFixed(3)}°</text><text x="${W - 70}" y="${H - 6}" font-size="12" fill="#7c887f">${o1.toFixed(3)}°</text></svg>
      <div class="legend">${Object.entries(col).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join('')}<span>${pts.length} ${t('points')}</span></div>`;
  },

  /* ======================= REGISTRE DES MÉNAGES ======================= */
  filtered() {
    const F = Views.F, q = U.norm(F.q);
    return [...S.hh.values()].filter((h) => {
      if (F.terr && h.territoire !== F.terr) return false;
      if (F.cep && h.cep !== F.cep) return false;
      if (F.ver === '1' && !(h.verifier && h.verifier.length)) return false;
      if (F.ver === 'profil' && h.profil && h.profil.completedAt) return false;
      if (F.st && Store.statusOf(h).code !== F.st) return false;
      if (q && !(U.norm(h.nom).includes(q) || U.norm(h.id).includes(q) || String(h.tel).includes(q) || String(h.carte).includes(q))) return false;
      return true;
    }).sort((a, b) => a.id.localeCompare(b.id));
  },
  async menages() {
    const qp = Q();
    if (qp.get('cep')) { Views.F.cep = qp.get('cep'); Views.F.terr = (S.ceps.get(Views.F.cep) || {}).territoire || ''; }
    const F = Views.F;
    await shell(`
      <div class="page-head"><div><div class="kicker">${t('Registre')}</div><h1>${t('Ménages bénéficiaires')}</h1><div class="sub">${S.hh.size} ${t('ménages')} · ${S.ceps.size} CEP</div></div>
        <a class="btn primary" href="#/nouveau">+ ${t('Nouveau ménage')}</a></div>
      <div class="filters">
        <input type="search" id="f-q" placeholder="${t('Rechercher : nom, ID, téléphone, carte d\'électeur')}" value="${U.esc(F.q)}">
        <select id="f-terr"><option value="">${t('Tous territoires')}</option>${UI.opt(Views.terrs(), F.terr)}</select>
        <select id="f-cep"><option value="">${t('Tous les CEP')}</option>${UI.opt(Views.cepsOf(F.terr).map((c) => [c.id, `${c.nom} (${c.id})`]), F.cep)}</select>
        <select id="f-st"><option value="">${t('Tous statuts')}</option>${UI.opt([['non_servi', t('Non servi')], ['partiel', t('Partiel')], ['servi', t('Servi')], ['valide', t('Validé')]], F.st)}</select>
        <select id="f-ver"><option value="">${t('Toutes fiches')}</option>${UI.opt([['1', t('À vérifier')], ['profil', t('Profilage à faire')]], F.ver)}</select>
      </div>
      <div id="list"></div>`);
    const draw = () => {
      const arr = Views.filtered();
      const shown = arr.slice(0, F.limit);
      U.$('#list').innerHTML = `<p class="muted small">${arr.length} ${t('résultat(s)')}</p><div class="list">${shown.map((h) => {
        const s = Store.statusOf(h), c = S.ceps.get(h.cep) || {};
        return `<a class="item" href="#/m/${encodeURIComponent(h.id)}"><div class="av">${U.esc(U.initials(h.nom))}</div><div class="main"><div class="t">${U.esc(h.nom)}</div>
          <div class="m"><span class="mono">${U.esc(h.id)}</span> · ${U.esc(c.nom || '')} · ${U.esc(h.sexe || '?')}${h.age ? ', ' + h.age + ' ' + t('ans') : ''}</div></div>
          <div class="side">${UI.badgeStatut(s.code)}${h.verifier && h.verifier.length ? `<span class="badge warn">${t('À vérifier')}</span>` : ''}${h.profil && h.profil.completedAt ? '' : `<span class="badge">${t('Non profilé')}</span>`}</div></a>`;
      }).join('')}</div>${arr.length > F.limit ? `<button class="btn block" id="more" style="margin-top:10px">${t('Afficher plus')} (${arr.length - F.limit})</button>` : ''}`;
      const m = U.$('#more'); if (m) m.onclick = () => { F.limit += 100; draw(); };
    };
    let tm;
    U.$('#f-q').oninput = (e) => { clearTimeout(tm); tm = setTimeout(() => { F.q = e.target.value; F.limit = 60; draw(); }, 200); };
    U.$('#f-terr').onchange = (e) => { F.terr = e.target.value; F.cep = ''; F.limit = 60; location.hash = '#/menages'; Views.menages(); };
    U.$('#f-cep').onchange = (e) => { F.cep = e.target.value; F.limit = 60; if (location.hash !== '#/menages') history.replaceState(null, '', '#/menages'); draw(); };
    U.$('#f-st').onchange = (e) => { F.st = e.target.value; F.limit = 60; draw(); };
    U.$('#f-ver').onchange = (e) => { F.ver = e.target.value; F.limit = 60; draw(); };
    draw();
  },

  async fichePdf(h) {
